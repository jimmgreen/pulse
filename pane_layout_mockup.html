<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse 布局条</title>
<style>
/* Layout: control strip → live Pulse window (draggable width, real tokens from FluentTokens.h MakeTheme) → top-chrome and status-bar readouts → spec cards */
:root {
  --bg: #F3F5F1; --title: #F1F3EE; --sheet: #F7F8F4; --card: #FFFFFF; --flyout: #FFFFFF; --status: #F7F8F4;
  --text: #303B50; --text2: #66748A; --text3: #929CAE;
  --hover: rgba(82,125,112,.055); --pressed: rgba(82,125,112,.09);
  --stroke: #DCE3D9; --divider: #E5EAE3; --input: rgba(255,255,255,.9); --input-focus: #FFFFFF;
  --accent: #0078D4; --accent-fg: #0067C0; --accent-soft: rgba(0,120,212,.095); --accent-soft2: rgba(0,120,212,.17); --on-accent: #FFFFFF;
  --sel-a: rgba(0,120,212,.30); --sel-b: rgba(0,120,212,.08); --sel-line: #0078D4;
  --folder: #BCA270; --file: #839FC4; --img: #5E9C7E; --zip: #B98A4B; --exe: #5B7FC7; --doc: #8A97AA; --csv: #4E9A5C; --pdf: #C8553D; --ppt: #CC6A3A;
  --ok: #0F7B0F; --warn: #9D5D00; --danger: #C42B1C;
  --shadow: 0 8px 24px rgba(48,59,80,.16), 0 1px 3px rgba(48,59,80,.10);
  --win-shadow: 0 18px 50px rgba(48,59,80,.16);
  --ghost: rgba(0,120,212,.07);
  --dim: .42;
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --icons: "Segoe Fluent Icons", "Segoe MDL2 Assets";
  --mono: "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1A1A; --title: #1A1A1A; --sheet: #202020; --card: #272727; --flyout: #2B2B2B; --status: #151515;
    --text: #FFFFFF; --text2: rgba(255,255,255,.606); --text3: rgba(255,255,255,.40);
    --hover: rgba(255,255,255,.08); --pressed: rgba(255,255,255,.06);
    --stroke: rgba(255,255,255,.07); --divider: rgba(255,255,255,.06); --input: rgba(255,255,255,.06); --input-focus: #1E1E1E;
    --accent: #0078D4; --accent-fg: #5AAAE6; --accent-soft: rgba(64,154,223,.17); --accent-soft2: rgba(64,154,223,.28); --on-accent: #FFFFFF;
    --sel-a: rgba(64,154,223,.45); --sel-b: rgba(64,154,223,.12); --sel-line: #5AAAE6;
    --folder: #FFCD70; --file: #78B0E8; --img: #7CC4A0; --zip: #E0B070; --exe: #8FB0F0; --doc: #B7C0CC; --csv: #6CC27E; --pdf: #F08070; --ppt: #F09060;
    --ok: #6CCB5F; --warn: #FCE100; --danger: #FF99A4;
    --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.35);
    --win-shadow: 0 18px 50px rgba(0,0,0,.45);
    --ghost: rgba(64,154,223,.10);
    --dim: .35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1A1A; --title: #1A1A1A; --sheet: #202020; --card: #272727; --flyout: #2B2B2B; --status: #151515;
  --text: #FFFFFF; --text2: rgba(255,255,255,.606); --text3: rgba(255,255,255,.40);
  --hover: rgba(255,255,255,.08); --pressed: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.07); --divider: rgba(255,255,255,.06); --input: rgba(255,255,255,.06); --input-focus: #1E1E1E;
  --accent: #0078D4; --accent-fg: #5AAAE6; --accent-soft: rgba(64,154,223,.17); --accent-soft2: rgba(64,154,223,.28); --on-accent: #FFFFFF;
  --sel-a: rgba(64,154,223,.45); --sel-b: rgba(64,154,223,.12); --sel-line: #5AAAE6;
  --folder: #FFCD70; --file: #78B0E8; --img: #7CC4A0; --zip: #E0B070; --exe: #8FB0F0; --doc: #B7C0CC; --csv: #6CC27E; --pdf: #F08070; --ppt: #F09060;
  --ok: #6CCB5F; --warn: #FCE100; --danger: #FF99A4;
  --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.35);
  --win-shadow: 0 18px 50px rgba(0,0,0,.45);
  --ghost: rgba(64,154,223,.10);
  --dim: .35;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); padding-inline: 16px; padding-block: 20px 48px; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 1px; }
.ic { font-family: var(--icons); font-style: normal; font-weight: normal; line-height: 1; }
kbd { font: 11px/1 var(--font); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--stroke); color: var(--text2); background: var(--hover); white-space: nowrap; }

/* ---------- page chrome ---------- */
.page { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head h1 { margin: 0; font: 600 22px/1.25 var(--display); text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--text2); max-width: 72ch; font-size: 13.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.ctl > span { font-size: 12px; color: var(--text2); letter-spacing: .02em; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--hover); border: 1px solid var(--stroke); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { padding: 3px 10px; border-radius: 5px; font-size: 12.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.wread { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; min-width: 92px; }
.wread b { color: var(--text); }
.tryline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text2); }
.tryline b { color: var(--text); font-weight: 600; }
.stage { position: relative; width: 100%; }

/* ---------- Pulse window ---------- */
.win { position: absolute; top: 0; left: 0; transform-origin: 0 0; height: 720px; display: flex; flex-direction: column;
  background: var(--title); border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; box-shadow: var(--win-shadow);
  font-size: 13px; line-height: 1.35; user-select: none; color: var(--text); }
.win.resizing .pane, .win.resizing .search, .win.resizing .tab { transition: none !important; }
.resizer { position: absolute; top: 0; right: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 40; display: grid; place-items: center; }
.resizer i { width: 4px; height: 56px; border-radius: 2px; background: var(--text3); opacity: 0; transition: opacity .15s; }
.resizer:hover i, .win.resizing .resizer i { opacity: .7; }

.titlebar { height: 48px; flex-shrink: 0; position: relative; }
.brand { position: absolute; left: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding-left: 12px; white-space: nowrap; transition: width .2s; }
.brand b { font: 600 14px var(--display); }
.brand small { font-size: 12px; color: var(--text2); }
.brand .tb-ic { margin-left: auto; }
.brand.compact .tb-ic { margin-left: -2px; }
.tb-ic { width: 34px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); font-size: 15px; flex-shrink: 0; }
.tb-ic:hover { background: var(--hover); color: var(--text); }
.edgeline { position: absolute; top: 8px; bottom: 0; width: 0; border-left: 1px dashed var(--accent-fg); opacity: 0; pointer-events: none; transition: opacity .2s; }
.edgeline.on { opacity: .55; }
.tabs { position: absolute; top: 0; height: 48px; display: flex; align-items: flex-end; gap: 2px; transition: left .2s; }
.tab { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; border-radius: 8px 8px 0 0; color: var(--text2); flex-shrink: 0; position: relative; overflow: hidden; transition: width .18s; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--sheet); color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: 12px; bottom: 2px; width: 18px; height: 3px; border-radius: 2px; background: var(--accent); }
.tab .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .tx { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9px; color: var(--text3); flex-shrink: 0; opacity: 0; }
.tab.on .tx, .tab:hover .tx { opacity: 1; }
.tab .tx:hover { background: var(--hover); color: var(--text); }
.tab svg { flex-shrink: 0; }
.tab.icon { padding: 0; justify-content: center; }
.tab.tight .tx { display: none; }
.tab.tight:hover .tx { display: grid; }
.tab.icon .tt, .tab.icon .tx { display: none; }
.tab.icon.on::after { left: 50%; margin-left: -9px; }
.tabmore { height: 30px; margin-bottom: 4px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; color: var(--text2); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.tabmore:hover, .tabadd:hover { background: var(--hover); color: var(--text); }
.tabmore .ic { font-size: 8px; }
.tabadd { width: 34px; height: 30px; margin-bottom: 4px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); flex-shrink: 0; }
.caption { position: absolute; right: 0; top: 0; display: flex; align-items: center; height: 48px; }
.caption .cap { width: 46px; height: 100%; display: grid; place-items: center; font-size: 10px; color: var(--text); }
.caption .cap:hover { background: var(--hover); }
.caption .sep { width: 10px; }

.body { flex: 1; min-height: 0; display: flex; background: var(--sheet); }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sidebar { width: 224px; flex-shrink: 0; padding: 4px 8px 8px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.sb-h { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; color: var(--text2); font-weight: 600; font-size: 12.5px; margin-top: 4px; white-space: nowrap; }
.sb-h .ic { font-size: 13px; }
.sb-i { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px 0 10px; border-radius: 6px; white-space: nowrap; overflow: hidden; }
.sb-i:hover { background: var(--hover); }
.sb-i .ic { font-size: 14px; color: var(--accent-fg); width: 16px; text-align: center; }
.drive { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px 8px 10px; border-radius: 6px; }
.drive.on { background: var(--hover); }
.drive .row { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.drive .row .ic { color: var(--accent-fg); font-size: 14px; width: 16px; }
.drive .row small { margin-left: auto; color: var(--text3); font-size: 11.5px; }
.drive .bar { height: 3px; border-radius: 2px; background: var(--divider); margin-left: 26px; overflow: hidden; }
.drive .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.drive .bar i.full { background: var(--warn); }
.sidebar.rail { width: 48px; padding: 4px 4px 8px; align-items: center; gap: 4px; }
.rail-i { width: 40px; height: 36px; border-radius: 6px; display: grid; place-items: center; color: var(--accent-fg); position: relative; }
.rail-i .ic { font-size: 15px; }
.rail-i:hover, .rail-i.on { background: var(--hover); }
.rail-i i.cap { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 2px; border-radius: 1px; background: var(--divider); overflow: hidden; }
.rail-i i.cap b { display: block; height: 100%; background: var(--accent); }
.rail-sep { width: 24px; height: 1px; background: var(--divider); margin: 4px 0; }

.nav { height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 0; padding: 0 8px 0 4px; }
.navb { height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); font-size: 15px; flex-shrink: 0; }
.navb:hover { background: var(--hover); color: var(--text); }
.navb[aria-disabled="true"] { color: var(--text3); }
.addr { flex: 1 1 auto; min-width: 60px; height: 32px; border-radius: 6px; background: var(--input); border: 1px solid var(--stroke); display: flex; align-items: center; gap: 2px; padding: 0 3px 0 6px; margin: 0 6px; overflow: hidden; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; white-space: nowrap; }
.crumbs .crumb { padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
.crumbs .crumb:last-of-type { font-weight: 600; }
.crumbs .crumb:hover, .crumbs .cmore:hover { background: var(--hover); }
.crumbs .cs { font-family: var(--icons); font-size: 9px; color: var(--text3); flex-shrink: 0; }
.crumbs .cmore { padding: 2px 6px; border-radius: 4px; color: var(--text2); flex-shrink: 0; }
.crumbs [hidden] { display: none !important; }
.in-ic { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; color: var(--text2); flex-shrink: 0; font-size: 13px; }
.in-ic:hover { background: var(--hover); color: var(--text); }
.search { flex-shrink: 0; height: 32px; border-radius: 6px; background: var(--input); border: 1px solid var(--stroke); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; color: var(--text3); white-space: nowrap; overflow: hidden; transition: width .18s cubic-bezier(.2,.8,.2,1); }
.search:hover { border-color: var(--text3); }
.search > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.search.iconly { padding: 0; justify-content: center; color: var(--text2); }
.search.editing { padding: 0 3px 0 4px; gap: 4px; background: var(--input-focus); border-color: var(--stroke); box-shadow: inset 0 -2px 0 var(--accent-fg); color: var(--text); }
.search.editing.fullrow { flex: 1 1 auto; margin-left: 6px; }
.schip { height: 24px; padding: 0 8px; border-radius: 4px; background: var(--hover); display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); flex-shrink: 0; }
.schip:hover { background: var(--pressed); }
.schip .ic { font-size: 11px; color: var(--accent-fg); }
.schip.icon { width: 26px; padding: 0; justify-content: center; }
.schip.mode { background: var(--accent-soft); color: var(--accent-fg); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; outline: none; padding: 0 4px; }
.search input::placeholder { color: var(--text3); }

.toolbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 8px 4px 8px; position: relative; }
.newbtn { height: 30px; display: flex; align-items: center; border-radius: 6px; background: var(--accent); color: var(--on-accent); margin-right: 6px; flex-shrink: 0; }
.newbtn > span { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 100%; }
.newbtn > span + span { border-left: 1px solid rgba(255,255,255,.28); padding: 0 8px; font-size: 10px; }
.newbtn.compact > span:first-child { padding: 0 9px; }
.tbtn { height: 30px; min-width: 32px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
.tbtn .ic { font-size: 15px; color: var(--text2); }
.tbtn:hover { background: var(--hover); }
.tbtn.pin { color: var(--text2); }
.tbtn.pin.on { background: var(--accent-soft); color: var(--accent-fg); }
.tbtn.pin.on .ic { color: var(--accent-fg); }
.tbtn.split { gap: 0; padding: 0; }
.tbtn.split > span { height: 100%; display: grid; place-items: center; padding: 0 7px; border-radius: 6px; }
.tbtn.split > span:hover { background: var(--hover); }
.tbtn.split .chev { font-family: var(--icons); font-size: 8px; padding: 0 5px; color: var(--text3); }
.tsep { width: 1px; height: 18px; background: var(--divider); margin: 0 6px; flex-shrink: 0; }
.grow { flex: 1; min-width: 0; }

.panes { flex: 1; min-height: 0; position: relative; margin: 0 8px 4px 4px; }
.pane { position: absolute; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden;
  container-type: inline-size; transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), opacity .22s ease; }
.pane.hide { opacity: 0; pointer-events: none; }
.pane.dim { opacity: var(--dim); }
.pane.drop-ok { box-shadow: inset 0 0 0 2px var(--accent-fg); }
.ph { height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 14px; position: relative; white-space: nowrap; }
.ph .pbar { position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); opacity: 0; }
.pane.focused .pbar { opacity: 1; }
.ph .pt { font-weight: 600; font-size: 13.5px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pane.focused .pt { color: var(--text); }
.badge { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-fg); flex-shrink: 0; }
.badge.muted { background: var(--hover); color: var(--text2); }
.ph .sp { flex: 1; min-width: 4px; }
.ib { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); flex-shrink: 0; }
.ib .ic { font-size: 14px; }
.ib:hover { background: var(--hover); color: var(--text); }
.ib.on { color: var(--accent-fg); }
.ib.zoom { opacity: 0; transition: opacity .12s; }
.pane:hover .ib.zoom, .pane.focused .ib.zoom, .ib.zoom:focus-visible { opacity: 1; }
.pane.zoomed .ib.zoom { display: none; }
.zchip { display: none; align-items: center; gap: 2px; height: 26px; padding: 0 2px 0 8px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-fg); font-size: 12px; flex-shrink: 0; }
.pane.zoomed .zchip { display: flex; }
.zchip .ic { font-size: 11px; margin-right: 4px; }
.zchip .zmore { color: var(--text2); margin-left: 6px; }
.zchip button { height: 22px; padding: 0 8px; border-radius: 11px; display: flex; align-items: center; gap: 6px; color: var(--text); background: var(--card); margin-left: 8px; }
.zchip kbd { padding: 1px 4px; font-size: 10.5px; }
@container (max-width: 420px) { .zchip .zmore { display: none; } }
.hmini { display: none; margin-left: 4px; }
.pane.zoomed .hmini { display: block; }
.ch { height: 30px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0,1fr) 132px 78px; align-items: center; padding: 0 12px 0 14px; color: var(--text2); font-size: 12.5px; border-bottom: 1px solid var(--divider); }
.ch span:first-child { color: var(--accent-fg); font-weight: 600; }
.ch .r, .row .r { text-align: right; }
.rows { flex: 1; min-height: 0; overflow: hidden; padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; }
.row { height: 28px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0,1fr) 132px 78px; align-items: center; padding: 0 6px 0 8px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.row:hover { background: var(--hover); }
.row.sel { background: linear-gradient(90deg, var(--sel-a), var(--sel-b)); box-shadow: inset 0 0 0 1px var(--sel-line); }
.pane:not(.focused) .row.sel { background: var(--hover); box-shadow: none; }
.row .n { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d, .row .s { color: var(--text2); font-size: 12.5px; white-space: nowrap; }
.row.new { animation: newrow 1.4s ease; }
@keyframes newrow { 0%, 40% { background: var(--accent-soft2); } 100% { background: transparent; } }
.fi { width: 16px; height: 16px; flex-shrink: 0; }
@container (max-width: 430px) { .ch, .row { grid-template-columns: minmax(0,1fr) 70px; } .ch .d, .row .d { display: none; } }
@container (max-width: 240px) { .ch, .row { grid-template-columns: minmax(0,1fr); } .ch .r, .row .s { display: none; } }
@container (max-width: 300px) { .ph .vw { display: none; } }

.ghost { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .14s ease; z-index: 6; }
.ghost.on { opacity: 1; }
.gslot { position: absolute; border: 1.5px dashed var(--accent-fg); border-radius: 8px; background: var(--ghost); display: grid; place-items: center; }
.gslot div { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 16px; background: var(--flyout); box-shadow: var(--shadow); font-weight: 600; font-size: 13px; white-space: nowrap; }
.gslot div small { font-weight: 400; color: var(--text2); font-size: 12px; }

// Tabs: natural (52 + text, ComputeTabStrip), then equal shrink down to 104,

function tabLayout(x0) {
  const right = S.ww - captionW() - 8 - TAB_DRAG_RESERVE - 34 - 4;
  const avail = Math.max(0, right - x0), n = S.tabs.length, gap = 2;
  // 60 = this mockup's icon, padding and close button (Pulse's own constant is 52).
  const nat = S.tabs.map((_, i) => Math.min(240, 60 + measure(tabTitle(i))));
  const sum = nat.reduce((a, b) => a + b, 0) + gap * (n - 1);
  if (sum <= avail) return { x0, avail, mode: 'natural', widths: nat, hidden: [], icon: [] };
  const each = (avail - gap * (n - 1)) / n;
  if (each >= 104) return { x0, avail, mode: 'shrink', widths: nat.map(w => Math.min(w, each)), hidden: [], icon: [] };
  const act = S.activeTab;
  const actW = Math.min(nat[act], 140);
  const others = [...Array(n).keys()].filter(i => i !== act);
  const fitIcons = Math.floor((avail - actW + gap) / 42);
  if (fitIcons >= others.length) return { x0, avail, mode: 'icons', widths: S.tabs.map((_, i) => i === act ? actW : 40), hidden: [], icon: others };
  const actFit = Math.max(56, Math.min(actW, avail - 44 - gap));
  const k = Math.max(0, Math.floor((avail - actFit - 44 + gap) / 42));

  const keep = others.sort((a, b) => Math.abs(a - act) - Math.abs(b - act)).slice(0, k);

    <tr><td>1 完整</td><td>≥ 760</td><td>和现在一样：后退、前进、向上、地址、刷新、搜索（27%，140–360）</td></tr>
    <tr><td>2 紧凑</td><td>600–760</td><td>刷新收进地址栏右端；搜索 180–260 DIP，保留“搜索源代码”</td></tr>
    <tr><td>3 窄</td><td>460–600</td><td>不能前进时隐藏“前进”；搜索收成 112 DIP 的“搜索”；路径留最后两级，前面收进 …</td></tr>
    <tr><td>4 合并</td><td>&lt; 460</td><td>搜索并入地址栏，地址栏右端放搜索按钮；点按钮、<kbd>Ctrl+K</kbd> 或 <kbd>Ctrl+F</kbd> 后地址栏原地变成搜索框，<kbd>Esc</kbd> 变回</td></tr>
  </table></div>
  <p>搜索中的字段沿用 <code>LayoutAddressSearch</code> 现有阈值：≥ 280 显示范围文字，≥ 200 只留范围图标，≥ 400 显示「文件名 / 内容」，≥ 260 显示选项按钮。1–3 档搜索中仍按现有逻辑向左借地址栏宽度（最多 520 DIP，地址栏至少留 120）。</p>
</article>
<article class="card">
  <h3>为什么布局放在状态栏最右端 <span class="badge">方案 A</span></h3>
  <p>布局命令现在都在工具栏「分屏布局」菜单里，要先找到右上角的按钮，点开再点一次。窗口窄于 540 DIP 时这个按钮还会进「更多」，又多一层。状态栏一直在视线里，右端和左侧 AI 芯片对称，文件操作和搜索进度都不占那里。</p>
  <ul>
    <li><b>7 个 26×22 按钮，约 200 DIP</b>，状态栏仍是 28 DIP 高。</li>
    <li><b>悬停 120 ms 出落位预览</b>，底部说明哪些栏收到后台，目标栏和对比是否受影响（与 <code>ApplyLayoutPreset</code> 一致）。</li>
    <li><b>单击即切换</b>；状态栏双击最大化（<code>BlankClickDeselect</code>）要排除这块区域。</li>
    <li>工具栏「分屏布局」按钮和菜单保留，设置里可以关掉布局条。</li>
  </ul>
</article>
<article class="card">
  <h3>状态栏放不下时谁先让位</h3>
  <p>按信息的时效排序：正在发生、能撤销的最重要，提示类文字最先让位。布局条最小 52 DIP，左边的 ‹ 表示还有，悬停或 Tab 聚焦就向左展开成浮层。</p>
  <div class="tbl"><table>
    <tr><th>级别</th><th>变化</th><th>理由</th></tr>
    <tr><td>1</td><td>隐藏右侧提示</td><td>提示是辅助信息，悬停时还会在别处出现</td></tr>
    <tr><td>2</td><td>AI 芯片只留 ✦ AI</td><td>与现有 640 DIP 规则一致</td></tr>
    <tr><td>3</td><td>布局条收成当前布局</td><td>仍可一次悬停直达</td></tr>
    <tr><td>4</td><td>项目数改为 “%d 项”</td><td>复用现有 <code>ItemsCountFormat</code></td></tr>
    <tr><td>5</td><td>选中改为 “已选中 %d 项”</td><td>复用现有 <code>SelectedCountFormat</code></td></tr>
    <tr><td>6</td><td>任务胶囊只留进度环</td><td>单击仍打开文件操作</td></tr>
  </table></div>
</article>
<article class="card">
  <h3>临时单栏和「单栏」有什么不同</h3>
  <p>临时单栏只改变显示，不改布局树。对比、目标栏、各栏位置都留着，还原时原样回来。</p>
  <div class="tbl"><table>
    <tr><th></th><th>单栏 <kbd>Ctrl+Alt+1</kbd></th><th>临时单栏 <kbd>${ZOOM_KEY}</kbd></th></tr>
    <tr><td>布局</td><td>换成单栏，其他栏收到后台</td><td>不变，只是这一栏占满窗格区</td></tr>
    <tr><td>目标栏</td><td>不在可见栏时清除</td><td>保留，小地图上用蓝点标出</td></tr>
    <tr><td>对比两个窗格</td><td>非双栏时关闭</td><td>暂停，还原后继续</td></tr>
    <tr><td>其他栏</td><td>看不见</td><td>在小地图里，悬停能看内容，能拖文件进去</td></tr>
    <tr><td>回去</td><td>重新选原来的布局</td><td><kbd>Esc</kbd>、再按一次快捷键、或点还原</td></tr>
  </table></div>
  <p>栏标题空白处的双击已用于返回或上一级，所以入口是标题右侧的 ${g('E740')} 按钮。<kbd>Esc</kbd> 先关菜单、预览卡和搜索，最后才还原。</p>
</article>
<article class="card">
  <h3>方案 B：工具栏悬停托盘</h3>
  <p>不动状态栏。鼠标在「分屏布局」按钮上停 0.25 秒托盘自己展开，按钮本身单击在单栏和上次的分屏之间切换。</p>
  <ul>
    <li><b>优点</b>：状态栏零占用，入口在熟悉的位置。</li>
    <li><b>代价</b>：视线要移到右上角；路过的鼠标容易误触发；窗口窄于 540 DIP 时按钮进「更多」，又回到点两次。</li>
  </ul>
</article>
