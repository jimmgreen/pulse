  <ellipse cx="256" cy="304" rx="122" ry="21" fill="#080A0F" fill-opacity="0.16"/>
  <circle cx="256" cy="154" r="118" fill="url(#ambient)"/>
  <circle cx="256" cy="154" r="103" stroke="#B5BECE" stroke-opacity="0.055" stroke-width="2"/>

  <g opacity="0.52">
    <path d="M168 96L172 107L183 111L172 115L168 126L164 115L153 111L164 107L168 96Z" fill="#C5CCD8"/>
    <path d="M355 88L359 99L370 103L359 107L355 118L351 107L340 103L351 99L355 88Z" fill="#C5CCD8"/>
    <circle cx="143" cy="178" r="4" fill="#9EA9BA"/>
