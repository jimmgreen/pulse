<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="360" viewBox="0 0 512 360" fill="none">
  <title>No excluded folders</title>
  <desc>A minus badge rising from a blue folder in the Pulse empty-state style.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(256 154) rotate(90) scale(121)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AAB4C6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7D899F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folderBack" x1="139" y1="174" x2="369" y2="273" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8298BC"/>
      <stop offset="0.52" stop-color="#60779D"/>
      <stop offset="1" stop-color="#354763"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="145" y1="205" x2="343" y2="323" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8499BC"/>
      <stop offset="0.48" stop-color="#586E92"/>
      <stop offset="1" stop-color="#35465F"/>
    </linearGradient>
    <linearGradient id="folderEdge" x1="133" y1="205" x2="374" y2="231" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D3DCEB" stop-opacity="0.55"/>
