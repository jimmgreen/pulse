<!doctype html>
<html lang='zh-CN' data-theme='dark'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Pulse 工作区侧栏</title>
<style>
/* Tokens follow FluentTokens.h MakeTheme(); sidebar metrics follow SidebarMetrics (header 36, row 32, drive 48, radius 12). Workspace rows are 46 tall, like the drive rows. */
:root{--page:#E6EAE3;--title:#F1F3EE;--sheet:#F7F8F4;--card:#FFFFFF;--flyout:#FFFFFF;--tabact:#F7F8F4;--text:#303B50;--t2:#66748A;--t3:#929CAE;--hover:rgba(82,125,112,.07);--hover2:rgba(82,125,112,.14);--selrow:rgba(15,108,189,.10);--stroke:#DCE3D9;--div:#E5EAE3;--field:rgba(255,255,255,.9);--field-f:#FFFFFF;--status:#F7F8F4;--accent:#0F6CBD;--accent-t:#0F6CBD;--onacc:#FFFFFF;--folder:#BCA270;--file:#839FC4;--warn:#B45309;--warnbg:rgba(180,83,9,.12);--danger:#C42B1C;--scrim:rgba(40,55,48,.28);--shadow:0 12px 36px rgba(40,60,50,.18);--ui:'Segoe UI Variable Text','Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif;--mono:'Cascadia Mono',Consolas,'Microsoft YaHei UI',monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--page:#111111;--title:#1A1A1A;--sheet:#202020;--card:#272727;--flyout:#2B2B2B;--tabact:#2C2C2C;--text:#FFFFFF;--t2:rgba(255,255,255,.606);--t3:rgba(255,255,255,.4);--hover:rgba(255,255,255,.08);--hover2:rgba(255,255,255,.12);--selrow:rgba(255,255,255,.10);--stroke:rgba(255,255,255,.07);--div:rgba(255,255,255,.06);--field:rgba(255,255,255,.06);--field-f:#1E1E1E;--status:#151515;--accent:#1A78D8;--accent-t:#58A6F0;--onacc:#FFFFFF;--folder:#FFCD70;--file:#78B0E8;--warn:#F5B450;--warnbg:rgba(245,180,80,.14);--danger:#FF8A80;--scrim:rgba(0,0,0,.45);--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme='dark']{--page:#111111;--title:#1A1A1A;--sheet:#202020;--card:#272727;--flyout:#2B2B2B;--tabact:#2C2C2C;--text:#FFFFFF;--t2:rgba(255,255,255,.606);--t3:rgba(255,255,255,.4);--hover:rgba(255,255,255,.08);--hover2:rgba(255,255,255,.12);--selrow:rgba(255,255,255,.10);--stroke:rgba(255,255,255,.07);--div:rgba(255,255,255,.06);--field:rgba(255,255,255,.06);--field-f:#1E1E1E;--status:#151515;--accent:#1A78D8;--accent-t:#58A6F0;--onacc:#FFFFFF;--folder:#FFCD70;--file:#78B0E8;--warn:#F5B450;--warnbg:rgba(245,180,80,.14);--danger:#FF8A80;--scrim:rgba(0,0,0,.45);--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:13px/1.4 var(--ui)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-t);outline-offset:-2px}
svg{display:block;flex:none}
kbd{font:inherit}
.sp{flex:1}
.page{max-width:1280px;margin:0 auto;padding:20px 16px 36px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{margin:0 0 4px;font-size:18px;font-weight:650}
.lede{margin:0;max-width:68ch;color:var(--t2)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;border:1px solid var(--stroke);background:var(--hover)}
.seg button{padding:5px 16px;border-radius:8px;color:var(--t2)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.win{position:relative;display:grid;grid-template-rows:48px 44px 44px minmax(0,1fr) 24px;height:840px;background:var(--sheet);border:1px solid var(--stroke);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.tbar{display:flex;align-items:center;gap:8px;padding:0 0 0 12px;background:var(--title);min-width:0}
.logo{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent)}
.tbar b{font-size:13px}
.sub2{color:var(--t2);font-size:12px;white-space:nowrap}
.ib{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--text)}
.ib:hover{background:var(--hover)}
.tabs{display:flex;gap:2px;align-self:flex-end;min-width:0;overflow:hidden}
.tab{position:relative;display:flex;align-items:center;gap:8px;width:190px;min-width:90px;height:36px;padding:0 6px 0 12px;border-radius:8px 8px 0 0;color:var(--t2);cursor:pointer}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--tabact);color:var(--text)}
.tab.on::after{content:'';position:absolute;left:12px;bottom:0;width:24px;height:2px;border-radius:2px;background:var(--accent-t)}
.tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;color:var(--t2)}
.tx:hover{background:var(--hover2)}
.wctl{display:flex;align-self:stretch}
.wctl .ib{width:44px;height:100%;border-radius:0}
.nav,.tools{display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:32px;padding:0 8px;border-radius:8px;background:var(--field);border:1px solid var(--stroke);overflow:hidden;white-space:nowrap}
.cr{padding:2px 6px;border-radius:6px}
.cr:last-child{font-weight:600}
.sep{display:grid;color:var(--t3)}
.gs{display:flex;align-items:center;gap:8px;width:260px;height:32px;padding:0 10px;border-radius:8px;background:var(--field);border:1px solid var(--stroke);color:var(--t2)}
.gs kbd,.kb{font-size:10.5px;min-width:18px;height:18px;padding:0 6px;border-radius:5px;display:inline-grid;place-items:center;border:1px solid var(--stroke);color:var(--t2);white-space:nowrap}
.gs kbd{margin-left:auto}
.newb{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--onacc);font-weight:600}
.vs{width:1px;height:20px;margin:0 4px;background:var(--div)}
.tl{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px}
.tl:hover{background:var(--hover)}
.wchip{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 8px;border-radius:8px;border:1px solid var(--stroke);background:var(--field)}
.wchip:hover{background:var(--hover)}
.wchip .wn{max-width:150px}
.body{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:0}
.side{display:flex;flex-direction:column;min-height:0;padding:0 8px 8px}
.sbody{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:2px 0 8px}
.sh{display:flex;align-items:center;gap:6px;height:36px;margin-top:6px;padding:0 4px 0 10px;border-radius:12px;cursor:pointer}
.sh:first-child{margin-top:0}
.sh:hover{background:var(--hover)}
.tt{font-weight:600;font-size:12.5px}
.cn{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hover2);font-size:11px;color:var(--t2);font-variant-numeric:tabular-nums}
.sb{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;color:var(--t2)}
.sb:hover{background:var(--hover2);color:var(--text)}
.chv{display:grid;place-items:center;width:24px;height:24px;color:var(--t2);transition:transform .15s}
.chv.shut{transform:rotate(-90deg)}
.gl{display:grid;place-items:center;width:16px;height:16px;flex:none}
.grp{display:flex;align-items:center;gap:6px;height:26px;margin-top:8px;padding:0 8px 0 4px;border-radius:8px;font-size:11.5px;letter-spacing:.04em;color:var(--t2);cursor:pointer}
.grp:hover{background:var(--hover)}
.grp .chv{width:18px;height:18px}
.grp.over-g{outline:2px solid var(--accent-t)}
.item{position:relative;margin-top:2px}
.item.over-t>.ws{box-shadow:inset 0 2px 0 var(--accent-t)}
.item.over-b>.ws{box-shadow:inset 0 -2px 0 var(--accent-t)}
.ws{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:46px;padding:0 6px 0 8px;border-radius:12px;cursor:pointer}
.ws:hover{background:var(--hover)}
.ws.on{background:var(--selrow)}
.ws.on::before{content:'';position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:2px;background:var(--accent-t)}
.ws.dragging{opacity:.45}
.tile{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.wt{display:flex;flex-direction:column;min-width:0;gap:1px}
.wn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsub{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{display:flex;align-items:center;justify-content:flex-end;min-width:26px}
.tr{display:flex;align-items:center;gap:6px}
.ra{display:none;gap:2px}
.ws:hover .ra,.ws:focus-within .ra{display:flex}
.ws:hover .tr,.ws:focus-within .tr{display:none}
.rb{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--t2)}
.rb:hover{background:var(--hover2);color:var(--text)}
.live{width:7px;height:7px;border-radius:50%;background:var(--accent-t);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-t) 25%,transparent)}
.dirty{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,#38BDF8 24%,transparent)}
.ren{width:100%;min-width:0;height:24px;padding:0 6px;border:1px solid var(--accent-t);border-radius:6px;background:var(--field-f);color:var(--text);outline:0}
.upbar{display:flex;align-items:center;gap:8px;height:30px;margin:2px 0 0 40px;padding:0 4px 0 10px;border-radius:8px;background:var(--warnbg);font-size:12px}
.ut{flex:1;white-space:nowrap}
.ub{padding:3px 8px;border-radius:6px;font-weight:600;color:var(--warn);white-space:nowrap}
.ub:hover{background:var(--hover2)}
.xp{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px 40px;padding-left:10px;border-left:1px solid var(--div)}
.pr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;align-items:center;height:28px;padding:0 8px;border-radius:8px;text-align:left}
.pr:hover{background:var(--hover)}
.pk{color:var(--t3);font-size:11px}
.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{color:var(--t2);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0 2px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:12px;border:1px solid var(--stroke);background:var(--field);font-size:11.5px}
.chip:hover{background:var(--hover2)}
.chip svg{color:var(--folder)}
.xa{display:flex;gap:6px;padding:6px 0 2px}
.xb{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--stroke);font-size:12px;white-space:nowrap}
.xb:hover{background:var(--hover)}
.xb.pri{background:var(--accent);border-color:transparent;color:var(--onacc);font-weight:600}
.save{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;width:100%;min-height:46px;margin-top:8px;padding:0 10px 0 8px;border:1px dashed var(--t3);border-radius:12px;text-align:left}
.save:hover{background:var(--hover);border-color:var(--accent-t)}
.fs{display:flex;align-items:center;gap:8px;height:30px;margin:2px 2px 4px;padding:0 10px;border-radius:8px;background:var(--field);border:1px solid var(--stroke);border-bottom-color:var(--t2);color:var(--t2)}
.fs:focus-within{border-bottom-color:var(--accent-t)}
.fs input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--text)}
.empty{padding:16px 10px;color:var(--t2);text-align:center}
.row{position:relative;display:flex;align-items:center;gap:8px;height:32px;margin-top:2px;padding:0 10px;border-radius:12px;cursor:pointer;min-width:0}
.row:hover{background:var(--hover)}
.row.on{background:var(--selrow)}
.row.sub{height:28px;margin-left:16px;font-size:12px;color:var(--t2)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{color:var(--t2);font-size:11.5px;white-space:nowrap}
.bdg{font-size:11px;padding:1px 8px;border-radius:8px;background:color-mix(in srgb,#34D399 26%,transparent)}
.drive{display:block;height:48px;padding:6px 10px}
.dl{display:flex;align-items:center;gap:8px;height:20px}
.bar{height:4px;margin:8px 0 0 24px;border-radius:2px;background:var(--hover2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.tray{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.trh{color:var(--accent-t);font-weight:600;font-size:12px}
.trs{color:var(--t2);font-size:11.5px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 12px 8px 4px}
.panes{flex:1;min-height:0;display:grid;gap:8px}
.c-single{grid-template-columns:1fr}
.c-2col{grid-template-columns:1fr 1fr}
.c-2row{grid-template-rows:1fr 1fr}
.c-quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pane{container-type:inline-size;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--card);border:1px solid var(--stroke);border-radius:12px}
.ph{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 14px;flex:none}
.pane.focus .ph::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--accent-t)}
.pt{font-weight:650}
.vt{display:flex;gap:2px}
.vb{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--t2)}
.vb.on{background:var(--hover2);color:var(--text)}
.pb{flex:1;min-height:0;overflow:hidden}
.ch,.fr{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:8px;align-items:center;padding:0 14px}
.ch{height:28px;color:var(--t2);font-size:11.5px;border-bottom:1px solid var(--div)}
.fr{height:30px}
.fr:hover{background:var(--hover)}
.fr.sel{background:var(--selrow)}
.fn{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi{display:grid;place-items:center}
.t-d{color:var(--folder)}.t-i{color:#5BC0A4}.t-x{color:var(--accent-t)}.t-z{color:#C99A2E}.t-p{color:#E5604D}.t-w{color:var(--file)}.t-t,.t-m{color:var(--t2)}
.fd{color:var(--t2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 10px;padding:10px 14px}
.ti{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;font-size:11.5px;text-align:center}
.ti span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th{display:grid;place-items:center;width:100%;aspect-ratio:4/3;border-radius:8px}
.listv{columns:2;column-gap:12px;padding:6px 10px}
.fr1{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;border-radius:6px;break-inside:avoid;white-space:nowrap;overflow:hidden}
.fr1:hover{background:var(--hover)}
@container (max-width:380px){.ch,.fr{grid-template-columns:minmax(0,1fr) 64px}.ch span:nth-child(2),.fr .fd:nth-child(2){display:none}.listv{columns:1}}
.st{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--status);font-size:11.5px;color:var(--t2)}
.fly{position:fixed;z-index:35;width:312px;padding:12px;background:var(--flyout);border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow);pointer-events:none}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fh b{display:block;font-size:13.5px}
.mono{font-family:var(--mono);font-size:11px;color:var(--t2);overflow-wrap:anywhere}
.mini{display:grid;gap:5px;aspect-ratio:16/10;padding:6px;border-radius:8px;background:var(--sheet);border:1px solid var(--stroke)}
.m-single{grid-template-columns:1fr}.m-2col{grid-template-columns:1fr 1fr}.m-2row{grid-template-rows:1fr 1fr}.m-quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mp{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0;padding:6px;border-radius:6px;background:var(--card);overflow:hidden}
.mh{font-style:normal;font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl{height:4px;border-radius:2px;background:var(--hover2)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.sg i{aspect-ratio:1;border-radius:3px;background:var(--hover2)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin-top:10px;font-size:12px}
.meta span{color:var(--t2)}
.menu{position:fixed;z-index:30;width:256px;padding:4px;background:var(--flyout);border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:8px;text-align:left}
.mi:hover{background:var(--hover)}
.mi span{flex:1}
.mi small{color:var(--t2);font-size:11.5px}
.mi svg{color:var(--t2)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.msep{height:1px;margin:4px 8px;background:var(--div)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:2px 10px}
.mrow>span:first-child{color:var(--t2);font-size:12px}
.dots,.gchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px var(--stroke)}
.dot.on{box-shadow:0 0 0 2px var(--flyout),0 0 0 4px var(--accent-t)}
.gc{padding:2px 10px;border-radius:999px;border:1px solid var(--stroke);font-size:11.5px}
.gc.on{background:var(--selrow);border-color:var(--accent-t)}
.qsw{position:absolute;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:96px;background:var(--scrim)}
.qsb{width:min(540px,calc(100% - 32px));background:var(--flyout);border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.qsf{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-bottom:1px solid var(--div);color:var(--t2)}
.qsf input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--text);font-size:14px}
.qsl{max-height:340px;overflow:auto;padding:6px}
.qi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;height:50px;padding:0 10px;border-radius:10px;cursor:pointer}
.qi.on{background:var(--selrow)}
.qh{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--div);font-size:11.5px;color:var(--t2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);padding:10px 14px;background:var(--flyout);border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow)}
.tb{color:var(--accent-t);font-weight:600}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 32px}
.note{border-top:1px solid var(--div);padding-top:10px}
.note h3{margin:0 0 4px;font-size:13px}
.note p{margin:0;max-width:48ch;color:var(--t2)}
@media (max-width:860px){.win{height:auto;grid-template-rows:48px auto auto auto 24px}.body{grid-template-columns:1fr}.side{height:640px}.main{height:560px;padding:0 12px 8px}.gs{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class='page'>

  h+=`</div>`});
 return h}

 let h=sec('star','star','#FBBF24','星标项目',null);

 if(!S.sc.quick)QA.forEach(a=>{h+=`<div class='row'><span class='gl' style='color:${a[2]}'>${ic(a[1])}</span><span class='nm'>${a[0]}</span><span class='cap'>${a[3]}</span></div>`});
 h+=sec('pc','pc','#4CC2FF','此电脑',null);
 if(!S.sc.pc)DR.forEach(d=>{h+=`<div class='row drive'><div class='dl'><span class='gl' style='color:var(--accent-t)'>${ic('drive')}</span><span class='nm'>${d[0]}</span><span class='cap'>${d[1]}</span></div><div class='bar'><i style='width:${d[2]}%;background:${d[3]}'></i></div></div>`});
 L.innerHTML=h;
 const r=$('ren');if(r){r.focus();r.select()}}
function pane(q,i){const set=F[tail(q.p)]||F.src,v=q.v;
 const tg=`<span class='vt'>${[['详细信息','detail'],['列表','list'],['图标','tiles']].map(a=>`<span class='vb${v===a[0]?' on':''}'>${ic(a[1],14)}</span>`).join('')}</span>`;
 let body;
 if(v==='图标')body=`<div class='gridv'>${set.map(f=>`<div class='ti'>${thumb(f)}<span>${esc(f[0])}</span></div>`).join('')}</div>`;
 else if(v==='列表')body=`<div class='listv'>${set.map(f=>`<div class='fr1'>${fi(f)}<span class='fn'>${esc(f[0])}</span></div>`).join('')}</div>`;
 else body=`<div class='ch'><span>名称</span><span>修改日期</span><span>大小</span></div>${set.map((f,k)=>`<div class='fr${i===0&&k===0?' sel':''}'><span class='fn'>${fi(f)}${esc(f[0])}</span><span class='fd'>${f[2]}</span><span class='fd'>${f[3]||'—'}</span></div>`).join('')}`;
 return `<section class='pane${i===0?' focus':''}' style='--i:${i}'><header class='ph'><span class='pt'>${esc(tail(q.p))}</span><span class='sp'></span>${tg}</header><div class='pb'>${body}</div></section>`}
function drawMain(){const w=cw();
 $('tabs').innerHTML=S.tabs.map((t,i)=>{const x=byId(t.ws)||S.ws[0];if(!x)return '';return `<div class='tab${i===S.cur?' on':''}' data-a='tabsel' data-t='${i}'><span style='color:${x.color}'>${lay(x.layout,18)}</span><span class='tn'>${esc(x.name)}</span><button class='tx' type='button' data-a='tabclose' data-t='${i}' aria-label='关闭标签页'>${ic('x',12)}</button></div>`}).join('');
 $('wchip').hidden=!w||S.mode==='old';
 if(!w){$('main').innerHTML=`<div class='empty'>还没有工作区，点侧栏里的加号保存当前布局</div>`;$('crumb').innerHTML='';$('st1').textContent='0 个工作区';$('st2').textContent='';return}
 $('wchip').innerHTML=`<span style='color:${w.color}'>${lay(w.layout,20)}</span><span class='wn'>${esc(w.name)}</span><kbd class='kb'>Ctrl+Alt+W</kbd>${ic('dn',12)}`;
 const cr=[w.unc?'网络':'此电脑',...w.root.split('/').filter(Boolean)];
 $('crumb').innerHTML=cr.map((c,i)=>(i?`<span class='sep'>${ic('chev',10)}</span>`:'')+`<span class='cr'>${esc(c)}</span>`).join('');
 $('main').innerHTML=`<div class='panes c-${w.layout}'>${w.panes.map(pane).join('')}</div>`;
 $('st1').textContent=`${w.panes.length} 个窗格 · ${LN[w.layout]}`;
 $('st2').textContent=`工作区：${w.name}`+(w.dirty?' · 分栏已变化':'')}
function draw(){$('fly').hidden=true;drawSide();drawMain()}
let tt;function toast(m,a,fn){const t=$('toast');t.innerHTML=`<span>${esc(m)}</span>`+(a?`<button class='tb' type='button'>${a}</button>`:'');t.hidden=false;if(a)t.querySelector('button').onclick=()=>{fn();t.hidden=true};clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},4200)}
function openIn(id){const w=byId(id);if(!w)return;S.tabs[S.cur].ws=id;w.last='刚刚';w.opens++;w.dirty=false;draw()}
function openNew(id){const w=byId(id);if(!w)return;S.tabs.push({ws:id});S.cur=S.tabs.length-1;w.last='刚刚';w.opens++;draw();toast(`已在新标签页打开「${w.name}」`)}
function upd(id){const w=byId(id);w.dirty=false;w.last='刚刚';draw();toast(`已用当前分栏更新「${w.name}」`)}
function del(id){const i=S.ws.findIndex(w=>w.id===id);if(i<0)return;const w=S.ws[i];S.ws.splice(i,1);draw();toast(`已取消工作区「${w.name}」`,'撤销',()=>{S.ws.splice(i,0,w);draw()})}
function commit(ok){const v=$('ren');if(!S.editing||!v)return;const w=byId(S.editing);S.editing=0;if(ok&&v.value.trim()&&w)w.name=v.value.trim();draw()}
function move(w,d){const sibs=S.ws.filter(x=>key(x)===key(w));const n=sibs[sibs.indexOf(w)+d];if(!n)return;const a=S.ws.indexOf(w),b=S.ws.indexOf(n);S.ws[a]=n;S.ws[b]=w;draw()}
function saveCur(from,suffix){const a=from||cw();const id=S.seq++;const base=a?a.panes.map(q=>({p:q.p,v:q.v})):[{p:'C:/Users/SS/Documents',v:'详细信息'}];
 const w={id,name:suffix&&a?a.name+' 副本':'新工作区 '+(id-5),root:base[0].p,layout:a?a.layout:'single',panes:base,group:'个人',color:COLORS[id%COLORS.length],pinned:false,last:'刚刚',opens:1,dirty:false,unc:false,freq:[]};
 S.ws.push(w);S.q='';S.find=false;S.sc.ws=false;S.gc['个人']=false;S.editing=id;S.tabs[S.cur].ws=id;draw()}
function hideMenu(){M.hidden=true}
function menu(x,y,id){const w=byId(id);if(!w)return;
 const it=(k,i,t,s,c)=>`<button class='mi${c||''}' type='button' data-m='${k}' data-id='${id}'>${ic(i)}<span>${t}</span><small>${s||''}</small></button>`;
 const sep=`<div class='msep'></div>`;
 if(S.mode==='old')M.innerHTML=it('open','folder','打开')+it('upd','refresh','用当前布局更新')+sep+it('del','trash','取消工作区','',' danger');
 else M.innerHTML=it('open','folder','打开','Enter')+it('tab','newtab','在新标签页打开','Ctrl+点击')+it('win','win','在新窗口打开')+sep+it('upd','refresh','用当前布局更新')+it('ren','rename','重命名','F2')+it('exp',S.open[id]?'cup':'dn',S.open[id]?'收起详情':'展开详情')+sep+it('pin','pin',w.pinned?'取消置顶':'置顶')+it('up','up','上移')+it('down','down','下移')+it('copy','copy','复制路径')+sep+
  `<div class='mrow'><span>颜色</span><span class='dots'>${COLORS.map(c=>`<button class='dot${c===w.color?' on':''}' type='button' data-m='color' data-id='${id}' data-c='${c}' style='background:${c}' aria-label='颜色 ${c}'></button>`).join('')}</span></div>`+
  `<div class='mrow'><span>分组</span><span class='gchips'>${GROUPS.map(g=>`<button class='gc${g===w.group&&!w.pinned?' on':''}' type='button' data-m='group' data-id='${id}' data-g='${g}'>${g}</button>`).join('')}</span></div>`+sep+it('del','trash','取消工作区','Del',' danger');
 M.hidden=false;const r=M.getBoundingClientRect();M.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';M.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px'}
M.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const id=+b.dataset.id,w=byId(id),k=b.dataset.m;if(!w)return;
 if(k==='color'){w.color=b.dataset.c;draw();menu(parseFloat(M.style.left),parseFloat(M.style.top),id);return}
 if(k==='group'){w.group=b.dataset.g;w.pinned=false;draw();menu(parseFloat(M.style.left),parseFloat(M.style.top),id);return}
 hideMenu();
 if(k==='open')openIn(id);
 else if(k==='tab')openNew(id);
 else if(k==='win')toast(`已在新窗口打开「${w.name}」`);
 else if(k==='upd')upd(id);
 else if(k==='ren'){S.editing=id;draw()}
 else if(k==='exp'){S.open[id]=!S.open[id];draw()}
 else if(k==='pin'){w.pinned=!w.pinned;draw()}
 else if(k==='up'||k==='down')move(w,k==='up'?-1:1);
 else if(k==='copy')toast('已复制路径 '+disp(w.root));
 else if(k==='del')del(id)});
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('[data-a=more]'))hideMenu()});
L.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||e.target.closest('.ren')||e.target.closest('.fs'))return;
 $('fly').hidden=true;
 const a=b.dataset.a,it=b.closest('.item'),id=it?+it.dataset.id:0;
 if(a==='sec'){const k=b.dataset.k;S.sc[k]=!S.sc[k];draw()}
 else if(a==='wfind'){S.find=!S.find;if(!S.find)S.q='';S.sc.ws=false;draw();const q=$('q');if(q)q.focus()}
 else if(a==='wadd'||a==='save')saveCur();
 else if(a==='saveas')saveCur(byId(id),true);
 else if(a==='grp'){S.gc[b.dataset.g]=!S.gc[b.dataset.g];draw()}
 else if(a==='open'){const c=cw();if(e.ctrlKey||e.metaKey)openNew(id);else if(S.mode==='new'&&c&&c.id===id){S.open[id]=!S.open[id];draw()}else openIn(id)}
 else if(a==='go')openIn(id);
 else if(a==='tab')openNew(id);
 else if(a==='ex'){S.open[id]=!S.open[id];draw()}
 else if(a==='more'){e.stopPropagation();const r=b.getBoundingClientRect();menu(r.left,r.bottom+4,id)}
 else if(a==='upd')upd(id);
 else if(a==='pane'||a==='freq')toast(`已在当前栏打开 ${disp(b.dataset.p)}`)});
L.addEventListener('contextmenu',e=>{const it=e.target.closest('.item');if(!it)return;e.preventDefault();$('fly').hidden=true;menu(e.clientX,e.clientY,+it.dataset.id)});
L.addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;draw();const q=$('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)});
L.addEventListener('focusout',e=>{if(e.target.id==='ren')commit(true)});
const refocus=id=>{const r=document.querySelector(`.item[data-id='${id}'] .ws`);if(r)r.focus()};
L.addEventListener('keydown',e=>{
 if(e.target.id==='ren'){if(e.key==='Enter')commit(true);else if(e.key==='Escape')commit(false);return}
 if(e.target.id==='q'){if(e.key==='Escape'){S.q='';S.find=false;draw()}return}
 if(e.target.classList.contains('sh')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();return}
 const row=e.target.closest('.ws');if(!row)return;const id=+row.closest('.item').dataset.id;
 if(e.key==='Enter'){e.preventDefault();if(e.ctrlKey)openNew(id);else openIn(id)}
 else if(e.key==='F2'){S.editing=id;draw()}
 else if(e.key==='Delete')del(id);
 else if(e.key==='ArrowRight'&&!S.open[id]){S.open[id]=1;draw();refocus(id)}
 else if(e.key==='ArrowLeft'&&S.open[id]){S.open[id]=0;draw();refocus(id)}
 else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const rs=[...L.querySelectorAll('.ws')];const i=rs.indexOf(row)+(e.key==='ArrowDown'?1:-1);if(rs[i])rs[i].focus()}});
let ft;
function skel(v){if(v==='图标')return `<div class='sg'>${'<i></i>'.repeat(6)}</div>`;return [86,64,78,52,70].map(n=>`<div class='sl' style='width:${n}%'></div>`).join('')}
function fly(id,row){const w=byId(id);if(!w)return;const f=$('fly');
 f.innerHTML=`<div class='fh'><span class='tile' style='--c:${w.color}'>${lay(w.layout)}</span><div><b>${esc(w.name)}</b><div class='mono'>${esc(disp(w.root))}</div></div></div><div class='mini m-${w.layout}'>${w.panes.map(q=>`<div class='mp'><i class='mh'>${esc(tail(q.p))}</i>${skel(q.v)}</div>`).join('')}</div><div class='meta'><span>布局</span><b>${LN[w.layout]} · ${w.panes.length} 栏</b><span>上次打开</span><b>${w.last}</b><span>打开次数</span><b>${w.opens} 次</b><span>当前状态</span><b>${live(id)?'已在 '+live(id)+' 个标签页打开':'未打开'}</b></div>`;
 f.hidden=false;const sr=document.querySelector('.side').getBoundingClientRect(),rr=row.getBoundingClientRect(),h=f.getBoundingClientRect().height;
 f.style.left=(sr.right+8)+'px';f.style.top=Math.max(8,Math.min(rr.top-10,innerHeight-h-12))+'px'}
L.addEventListener('mouseover',e=>{if(S.mode!=='new'||S.drag||!M.hidden)return;const r=e.target.closest('.ws');if(!r||r.contains(e.relatedTarget))return;clearTimeout(ft);const id=+r.closest('.item').dataset.id;ft=setTimeout(()=>fly(id,r),420)});
L.addEventListener('mouseout',e=>{const r=e.target.closest('.ws');if(!r||r.contains(e.relatedTarget))return;clearTimeout(ft);$('fly').hidden=true});
L.addEventListener('dragstart',e=>{const r=e.target.closest('.ws');if(!r)return;S.drag=+r.closest('.item').dataset.id;r.classList.add('dragging');clearTimeout(ft);$('fly').hidden=true;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(S.drag))});
const clr=()=>L.querySelectorAll('.over-t,.over-b,.over-g').forEach(n=>n.classList.remove('over-t','over-b','over-g'));
L.addEventListener('dragover',e=>{if(!S.drag)return;const it=e.target.closest('.item'),g=e.target.closest('.grp');if(!it&&!g)return;e.preventDefault();clr();if(it){const r=it.querySelector('.ws').getBoundingClientRect();it.classList.add(e.clientY<r.top+r.height/2?'over-t':'over-b')}else g.classList.add('over-g')});
L.addEventListener('drop',e=>{if(!S.drag)return;const it=e.target.closest('.item'),g=e.target.closest('.grp');if(!it&&!g)return;e.preventDefault();const m=byId(S.drag);
 if(it&&byId(+it.dataset.id)===m){clr();S.drag=0;return}
 S.ws.splice(S.ws.indexOf(m),1);
 if(it){const t=byId(+it.dataset.id);const r=it.querySelector('.ws').getBoundingClientRect();let i=S.ws.indexOf(t);if(e.clientY>=r.top+r.height/2)i++;S.ws.splice(i,0,m);m.group=t.group;m.pinned=t.pinned}
 else{const k=g.dataset.g;m.pinned=k==='置顶';if(!m.pinned)m.group=k;let last=-1;S.ws.forEach((w,i)=>{if(key(w)===k)last=i});S.ws.splice(last+1,0,m)}
 S.drag=0;clr();draw()});
L.addEventListener('dragend',()=>{S.drag=0;clr();L.querySelectorAll('.dragging').forEach(n=>n.classList.remove('dragging'))});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const t=+b.dataset.t;
 if(b.dataset.a==='tabclose'){e.stopPropagation();if(S.tabs.length>1){S.tabs.splice(t,1);if(S.cur>=S.tabs.length)S.cur=S.tabs.length-1;else if(t<S.cur)S.cur--}draw()}
 else{S.cur=t;draw()}});
$('newtab').onclick=()=>{const w=cw();if(w){S.tabs.push({ws:w.id});S.cur=S.tabs.length-1}draw()};
$('theme').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
$('seg').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;S.mode=b.dataset.m;$('seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));closeQS();hideMenu();draw()});
function drawQS(){const q=S.qs.q.trim().toLowerCase(),F2=flat();const list=F2.filter(w=>!q||(w.name+' '+w.root).toLowerCase().includes(q));S.qs.list=list;if(S.qs.i>=list.length)S.qs.i=Math.max(0,list.length-1);
 $('qsl').innerHTML=list.length?list.map((w,i)=>{const n=F2.indexOf(w)+1;return `<div class='qi${i===S.qs.i?' on':''}' data-i='${i}'><span class='tile' style='--c:${w.color}'>${lay(w.layout)}</span><span class='wt'><span class='wn'>${esc(w.name)}</span><span class='wsub'>${esc(disp(w.root))} · ${LN[w.layout]}</span></span><span class='tr'>${live(w.id)?`<span class='live'></span>`:''}${n<=9?`<span class='kb'>Ctrl+Alt+${n}</span>`:''}</span></div>`}).join(''):`<div class='empty'>没有匹配的工作区</div>`;
 const on=$('qsl').querySelector('.on');if(on)on.scrollIntoView({block:'nearest'})}
function openQS(){if(S.mode!=='new')return;hideMenu();S.qs.q='';S.qs.i=0;$('qsw').hidden=false;$('qsi').value='';drawQS();$('qsi').focus()}
function closeQS(){$('qsw').hidden=true}
function pickQS(i,nt){const w=S.qs.list[i];closeQS();if(!w)return;if(nt)openNew(w.id);else openIn(w.id)}

$('qsi').addEventListener('input',e=>{S.qs.q=e.target.value;S.qs.i=0;drawQS()});
$('qsi').addEventListener('keydown',e=>{const n=S.qs.list.length;
 if(e.key==='ArrowDown'){e.preventDefault();S.qs.i=Math.min(S.qs.i+1,Math.max(0,n-1));drawQS()}
 else if(e.key==='ArrowUp'){e.preventDefault();S.qs.i=Math.max(S.qs.i-1,0);drawQS()}
 else if(e.key==='Enter'){e.preventDefault();pickQS(S.qs.i,e.ctrlKey)}
 else if(e.key==='Escape'){e.preventDefault();closeQS()}});

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){hideMenu();$('fly').hidden=true}

const NOTES=[['先看清再打开','悬停任一工作区约半秒，弹出预览：分栏方式、每一栏的文件夹和视图、上次打开时间和打开次数。'],['一眼分辨','行首图标画出分栏方式，颜色可自选。蓝点表示已在某个标签页打开，黄点表示当前分栏和保存的不同。'],['随手切换','Ctrl+Alt+W 打开快速切换，输入名称或路径过滤。Ctrl+Alt+1 到 9 直接跳转，Ctrl+Enter 在新标签页打开。'],['分栏变化可见','当前分栏变了，行下直接出现「更新」和「另存为」，不用再去右键菜单里找。'],['整理方式','置顶、按项目、服务器、个人分组，每组可折叠。拖动行排序，拖到组标题上换组，右键可改色。'],['落地需要','Workspace 新增 color、group、pinned、last_opened、open_count。文字走 catalog.tsv，改动集中在 app_model.cpp、places.h/.cpp、quick_access.cpp、ui_sidebar.cpp。']];
$('notes').innerHTML=NOTES.map(n=>`<div class='note'><h3>${n[0]}</h3><p>${n[1]}</p></div>`).join('');
document.querySelectorAll('[data-i]').forEach(n=>{n.innerHTML=ic(n.dataset.i,+n.dataset.s||16)});
draw();
