name: Build and publish Pulse

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  l10n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/l10n/requirements.txt
      - run: python tools/l10n/gen_strings.py --check
      - run: python tools/l10n/check_service_text.py
      - run: python tools/l10n/check_no_pick.py
  build:
    needs: l10n
    runs-on: windows-2022
    # Cold verification already takes ~48 minutes before the production rebuild.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        channel: [windows, win81]
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_REF -ne "refs/tags/v$version") {
            throw 'Push or select a version tag matching version.txt, for example v1.0.3.'
          }
      - name: Build and verify release payload
        shell: pwsh
        env:
          # Opt in only for the explicitly approved tag; other releases run tests.
          QUICK_RELEASE_TAG: ${{ vars.PULSE_QUICK_RELEASE_TAG }}
        run: |
          $quick = $env:QUICK_RELEASE_TAG -eq $env:GITHUB_REF_NAME
          ./scripts/build_release_ci.ps1 -Channel '${{ matrix.channel }}' -SkipTests:$quick
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.channel }}
          path: |
            dist/PulseSetup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack-${{ matrix.channel }}
          path: dist/content-pack-${{ matrix.channel }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ai-pack-${{ matrix.channel }}
          path: dist/ai-pack-${{ matrix.channel }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.channel }}
          path: |
            bench_data/win81_imports.json
            bench_data/selftest_1b2_last.log
            build-ci/*.log
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      # One directory per channel: dist/content-pack-windows, dist/content-pack-win81.
      - uses: actions/download-artifact@v4
        with:
          pattern: content-pack-*
          path: dist
      # Likewise dist/ai-pack-windows, dist/ai-pack-win81.
      - uses: actions/download-artifact@v4
        with:
          pattern: ai-pack-*
          path: dist
      - name: Sign manifests and publish both installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_UPDATE_PRIVATE_KEY: ${{ secrets.PULSE_UPDATE_PRIVATE_KEY }}
          PULSE_PREVIEW_PACK_SOURCE_TAG: ${{ vars.PULSE_PREVIEW_PACK_SOURCE_TAG }}
        run: ./scripts/publish_release.ps1