name: Build RAW preview pack

# pulse-rawpack.exe and the replaceable LibRaw DLL. Run manually; a tag
# "pack-raw-<version>" publishes the files and their manifest to a release
# of that name, where Pulse's pack installer finds them.

on:
  workflow_dispatch:
    inputs:
      pack_version:
        description: Pack version (e.g. 1.0.0)
        required: true
        default: '1.0.0'
      reuse_published:
        description: Verify the existing published pack without rebuilding or publishing
        type: boolean
        required: false
        default: false
  push:
    tags: ['pack-raw-[0-9]*']

permissions:
  contents: read

env:
  # Pin dependency sources for reproducible pack builds.
  VCPKG_COMMIT: d46283cf33cf5de7bd88e12156ce03882be1f179

jobs:
  verify_published:
    name: Verify published RAW pack (no rebuild)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_published }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published RAW pack (no rebuild)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          python scripts/ensure_release_packs.py --repository '${{ github.repository }}' --verify-independent raw --expected-pack-version "$env:RAW_PACK_VERSION"
          if ($LASTEXITCODE) { throw "Published RAW pack verification failed ($LASTEXITCODE)" }
          'Verified published RAW pack; engine was not rebuilt; no assets uploaded or published.' >> $env:GITHUB_STEP_SUMMARY

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.reuse_published }}
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Resolve version
        id: version
        run: |
          if ('${{ github.ref }}' -like 'refs/tags/pack-raw-*') {
            "value=$('${{ github.ref_name }}' -replace '^pack-raw-','')" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ inputs.pack_version }}" >> $env:GITHUB_OUTPUT
          }
      - name: vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
      - uses: actions/cache@v4
        with:
          path: build/rawpack/binarycache
          key: rawpack-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packs/raw/vcpkg.json', 'packs/raw/ports/**', 'packs/raw/triplets/**') }}
      - name: Build
        # Includes synthetic DNG decode and malformed input checks.
        run: |
          & packs/raw/build.ps1 -VcpkgRoot "$env:RUNNER_TEMP\vcpkg" -Work build/rawpack
          if ($LASTEXITCODE) { throw "build.ps1 failed ($LASTEXITCODE)" }
      - name: Package
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $pack = 'build/rawpack/pack'
          # Pulse downloads each file as <name>.lzms (Windows Compression API,
          # present since Windows 8) and checks the hashes pinned in its source.
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class Lzms {
              [DllImport("cabinet.dll", SetLastError = true)] static extern bool CreateCompressor(uint algorithm, IntPtr routines, out IntPtr handle);
              [DllImport("cabinet.dll", SetLastError = true)] static extern bool Compress(IntPtr handle, byte[] data, UIntPtr size, byte[] output, UIntPtr outputSize, out UIntPtr written);
              [DllImport("cabinet.dll")] static extern bool CloseCompressor(IntPtr handle);
              public static byte[] Pack(byte[] data) {
                  IntPtr handle;
                  if (!CreateCompressor(5, IntPtr.Zero, out handle)) throw new Win32Exception();
                  try {
                      UIntPtr needed;
                      Compress(handle, data, (UIntPtr)data.Length, null, UIntPtr.Zero, out needed);
                      byte[] output = new byte[(int)needed.ToUInt64()];
                      UIntPtr written;
                      if (!Compress(handle, data, (UIntPtr)data.Length, output, (UIntPtr)output.Length, out written)) throw new Win32Exception();
                      Array.Resize(ref output, (int)written.ToUInt64());
                      return output;
                  } finally { CloseCompressor(handle); }
              }
          }
          '@
          $sha = { param($p) (Get-FileHash $p -Algorithm SHA256).Hash.ToLower() }
          $files = Get-ChildItem $pack -File | Sort-Object Name | ForEach-Object {
            $packed = "$($_.Name).lzms"
            [IO.File]::WriteAllBytes((Join-Path $PWD $packed), [Lzms]::Pack([IO.File]::ReadAllBytes($_.FullName)))
            [ordered]@{
              name = $_.Name; size = $_.Length; sha256 = & $sha $_.FullName
              packed = [ordered]@{ name = $packed; size = (Get-Item $packed).Length; sha256 = & $sha $packed }
            }
          }
          # The block to paste into src/app/pack_catalog.h.
          $base = "https://github.com/${{ github.repository }}/releases/download/pack-raw-$version/"
          $lines = @("// pack-raw-$version, generated by .github/workflows/preview-pack-raw.yml",
                     'inline constexpr PackFile kRawPackFiles[] = {')
          foreach ($f in $files) {
            $lines += "    {L`"$($f.name)`", $($f.size), L`"$($f.sha256)`", $($f.packed.size), L`"$($f.packed.sha256)`"},"
          }
          $lines += '};'
          $lines += "inline constexpr PackRelease kRawPackRelease{L`"raw`", L`"$version`", L`"$base`","
          $lines += '    kRawPackFiles, sizeof(kRawPackFiles) / sizeof(kRawPackFiles[0])};'
          $lines | Set-Content -Encoding utf8 pack-catalog.inc
          "### pack_catalog.h`n``````cpp" | Add-Content $env:GITHUB_STEP_SUMMARY
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $manifest = [ordered]@{
            id = 'raw'; version = $version; license = 'LGPL-2.1-only OR CDDL-1.0'
            files = $files
            min_pulse = '1.0.53'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "pulse-pack-raw-$version.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pack-raw
          path: |
            pulse-pack-raw-*.json
            *.lzms
            pack-catalog.inc
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/pack-raw-') && (github.event_name != 'workflow_dispatch' || !inputs.reuse_published) }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack-raw
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # --latest=false: Pulse's updater reads releases/latest/download/update-manifest.json,
          # so a pack release must never become the repository's "latest" release.
          gh release create $tag --repo '${{ github.repository }}' --latest=false --title "RAW preview pack $($tag -replace 'pack-raw-','')" `
            --notes 'Optional LibRaw camera RAW decoder for Pulse previews. Installed from Settings > Preview packs.' `
            (Get-ChildItem pulse-pack-raw-*, *.lzms, pack-catalog.inc)
