name: l10n

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/l10n/**'
      - 'tools/zh_tw/**'
      - 'tools/actions/**'
      - '.github/workflows/l10n.yml'
  # Product-code changes are validated by the consolidated Windows test
  # workflow. Keep this fast workflow for localization/tooling-only PRs.
  pull_request:
    paths:
      - 'tools/l10n/**'
      - 'tools/zh_tw/**'
      - 'tools/actions/**'
      - '.github/workflows/l10n.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned tools
        run: pip install -r tools/l10n/requirements.txt
      - name: Generated string outputs are up to date
        run: python tools/l10n/gen_strings.py --check
      - name: Helper-process text has English translations
        run: python tools/l10n/check_service_text.py
      - name: No new Pick() literals in product code
        run: python tools/l10n/check_no_pick.py
      - name: Every action is registered for menus, palette and the assistant
        run: python tools/actions/check_actions.py --strict
