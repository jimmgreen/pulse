name: Pulse shipped-SDK clarity experiment
on:
  push:
    branches: ['dot/lumatext-clarity-test*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-clarity:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact shipped SDK
        shell: pwsh
        run: |
          ./scripts/verify_lumatext_sdk.ps1
          New-Item -ItemType Directory -Force out/clarity | Out-Null
          Get-FileHash third_party/lumatext/bin/lumatext.dll | Format-List | Out-File out/clarity/sdk-hash.txt
      - name: Configure only the standalone diagnostic
        run: cmake -S tools/clarity_test -B out/clarity-build -G "Visual Studio 17 2022" -A x64
      - name: Build only the standalone diagnostic
        run: cmake --build out/clarity-build --config Release --parallel
      - name: Run actual wrapper and matched native controls
        shell: pwsh
        run: |
          & ./out/clarity-build/Release/pulse_clarity.exe out/clarity 2>&1 | Tee-Object out/clarity/run.log
          if ($LASTEXITCODE -ne 0) { throw "Clarity harness failed: $LASTEXITCODE" }
          Get-FileHash "$env:WINDIR/Fonts/msyh.ttc", "$env:WINDIR/Fonts/msyhbd.ttc" | Format-List | Out-File out/clarity/font-hashes.txt
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber | ConvertTo-Json | Out-File out/clarity/os.json
      - name: Analyze edge spread and reject invalid captures
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          python tools/clarity_test/analyze.py out/clarity | Tee-Object out/clarity/analysis.log
          if ($LASTEXITCODE -ne 0) { throw 'Image validation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-shipped-sdk-clarity
          path: |
            out/clarity
            out/clarity-build/Release/pulse_clarity.exe
            out/clarity-build/Release/lumatext.dll
          if-no-files-found: error
