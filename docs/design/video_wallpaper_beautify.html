<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌面整理 · 美化桌面与视频壁纸</title>
<style>
:root{
  --ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;
  --acc:#F2542D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:#111;color:#eee;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ---------- mockup chrome (not part of Pulse) ---------- */
.bar{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:rgba(18,18,20,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07);z-index:50;font-size:12.5px;color:#c9c9cc;white-space:nowrap}
.bar b{color:#fff;font-weight:600;font-size:13px}
.bar .grp{display:flex;align-items:center;gap:6px}
.bar .grp>span{color:#8a8a90}
.mseg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:7px;padding:2px;gap:2px}
.mseg button{border:0;background:transparent;padding:4px 9px;border-radius:5px;cursor:pointer;color:#bdbdc2;font-size:12px}
.mseg button.on{background:rgba(255,255,255,.16);color:#fff}
.bar select{background:#2a2a2e;color:#eee;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 6px;font:inherit;font-size:12px}
main{position:absolute;inset:48px 0 0 0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* ---------- desktop ---------- */
.fit{position:absolute;left:50%;top:50%;transform-origin:0 0}
.desk{position:relative;width:1600px;height:900px;overflow:hidden;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.desk .wp{position:absolute;inset:0}
.desk .wp svg{width:100%;height:100%;display:block}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(32,32,34,.66);backdrop-filter:blur(30px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:6px}
.taskbar i{width:36px;height:36px;border-radius:6px;display:block;background:rgba(255,255,255,.09)}
.taskbar .tray{position:absolute;right:14px;font-size:12px;color:#fff;text-align:right;line-height:1.35}
.group{position:absolute;left:28px;top:28px;width:316px;border-radius:22px;padding:12px 14px 14px;color:#fff;
  background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.18)}
.group h4{margin:0 0 10px;font:600 13px var(--ui);display:flex;justify-content:space-between;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.group h4 span{opacity:.75;font-weight:400}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:center;line-height:1.25}
.ic .f{width:40px;height:40px;border-radius:9px;display:grid;place-items:center}
.paused-veil{position:absolute;inset:0;background:rgba(0,0,0,.18);display:none}

/* ---------- drawer (Pulse) ---------- */
.drawer{position:absolute;right:20px;top:20px;width:372px;border-radius:22px;overflow:hidden;color:var(--pri);
  background:var(--glass);backdrop-filter:blur(30px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),0 24px 60px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.12)}
.light{--pri:#181E28;--sec:rgba(48,56,70,.62);--ter:rgba(48,56,70,.38);--glass:rgba(250,250,248,.74);--hi:rgba(255,255,255,.9);
  --edge:rgba(0,0,0,.07);--track:rgba(0,0,0,.055);--knob:#fff;--line:rgba(0,0,0,.08);--tile-edge:rgba(0,0,0,.12);--chip:rgba(0,0,0,.55);--card:rgba(255,255,255,.55)}
.dark{--pri:rgba(255,255,255,.97);--sec:rgba(255,255,255,.57);--ter:rgba(255,255,255,.34);--glass:rgba(32,32,36,.66);--hi:rgba(255,255,255,.16);
  --edge:rgba(255,255,255,.1);--track:rgba(255,255,255,.08);--knob:#0A121E;--line:rgba(255,255,255,.1);--tile-edge:rgba(255,255,255,.16);--chip:rgba(0,0,0,.55);--card:rgba(255,255,255,.06)}
.dh{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px 0 18px}
.dh svg.pal{width:20px;height:20px;color:var(--acc)}
.dh h3{flex:1;margin:0;font:600 17px var(--disp)}
.x{width:28px;height:28px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;color:var(--sec);cursor:pointer}
.x:hover{background:var(--track)}
.tabs{margin:0 18px 12px;display:flex;background:var(--track);border-radius:16px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;height:26px;border-radius:13px;font-size:13px;color:var(--pri);cursor:pointer}
.tabs button.on{background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.05);font-weight:600}
.dark .tabs button.on{background:rgba(255,255,255,.18)}
.body{padding:0 18px 16px;min-height:300px}
.cap{font-size:12px;color:var(--sec);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.cap a{color:var(--acc);text-decoration:none;cursor:pointer}

/* preview */
.pv{position:relative;width:336px;height:189px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--tile-edge)}
.pv .img{position:absolute;inset:0}
.pv .img svg{width:100%;height:100%;display:block}
.chip{position:absolute;left:8px;top:8px;height:22px;border-radius:11px;padding:0 9px 0 7px;display:flex;align-items:center;gap:5px;
  background:var(--chip);backdrop-filter:blur(8px);color:#fff;font-size:11.5px}
.chip svg{width:11px;height:11px}
.pbtn{position:absolute;right:8px;bottom:8px;height:28px;border-radius:14px;border:0;padding:0 12px 0 9px;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff;font-size:12px;cursor:pointer}
.pbtn svg{width:11px;height:11px}
.pv .veil{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#fff;font-size:12.5px;text-align:center}
.prog{position:absolute;left:12px;right:12px;bottom:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.drop{position:absolute;inset:0;border:2px dashed var(--acc);border-radius:14px;background:color-mix(in srgb,var(--acc) 10%,var(--glass));backdrop-filter:blur(14px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--pri);font-size:13px}
.drop svg{width:26px;height:26px;color:var(--acc)}

/* thumbs */
.row{display:flex;gap:6px}
.th{width:62px;flex:none;cursor:pointer;text-align:center}
.th .t{position:relative;height:40px;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--tile-edge)}
.th .t svg{width:100%;height:100%;display:block}
.th.on .t{box-shadow:0 0 0 2px var(--acc)}
.th span{display:block;margin-top:4px;font-size:11.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.on span{color:var(--acc);font-weight:600}
.th .t .dur{position:absolute;right:3px;bottom:3px;font-size:9.5px;line-height:13px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff}
.th .t .warn{position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:7px;background:#FFB020;color:#000;font:700 10px/14px var(--ui)}
.th.add .t{box-shadow:none;border:1.5px dashed var(--tile-edge);display:grid;place-items:center;color:var(--sec);background:transparent}
.th.add .t svg{width:16px;height:16px}
.th.dis{opacity:.4;pointer-events:none}

/* info + rows */
.info{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.info .nm{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.info .nm em{font-style:normal;font-weight:400;color:var(--sec);font-size:12px;margin-left:auto}
.st{margin-top:6px;font-size:12px;color:var(--sec);display:flex;align-items:center;gap:6px;line-height:1.45}
.st .dot{width:7px;height:7px;border-radius:4px;flex:none;background:#34C759}
.st.warn .dot{background:#FFB020}
.st.err .dot{background:#FF3B30}
.st.busy .dot{background:var(--acc)}
.acts{margin-top:8px;display:flex;gap:8px}
.cbtn{height:28px;border-radius:14px;border:0;padding:0 14px;font-size:12.5px;cursor:pointer;background:var(--track);color:var(--pri)}
.cbtn.pri{background:var(--acc);color:#fff;font-weight:600}
.line{display:flex;align-items:center;justify-content:space-between;min-height:36px;font-size:14px}
.sw{width:38px;height:22px;border-radius:11px;position:relative;background:var(--track);cursor:pointer;flex:none}
.sw.on{background:var(--acc)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on::after{left:19px}
.cseg{display:flex;background:var(--track);border-radius:16px;padding:3px;gap:0}
.cseg button{flex:1;border:0;background:transparent;height:26px;border-radius:13px;font-size:12.5px;color:var(--pri);cursor:pointer;white-space:nowrap}
.cseg button.on{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent)}
.cseg.sm{width:150px}
.hint{font-size:11.5px;color:var(--ter);margin-top:8px;line-height:1.5}
.sw-row{display:flex;gap:12px;margin:6px 0 4px 2px}
.sw-row i{width:21px;height:21px;border-radius:11px;display:block;cursor:pointer}
.sw-row i.on{box-shadow:0 0 0 2px var(--glass),0 0 0 4px currentColor}
.wg{display:flex;gap:6px}
.wg div{flex:1;height:58px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
.wg div small{color:var(--sec);font-size:11px}
.wg div.on{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}

/* ---------- Pulse window + context menu ---------- */
.pw{position:absolute;left:120px;top:90px;width:900px;height:560px;border-radius:8px;overflow:hidden;background:#F3F5F1;color:#1B1F24;
  box-shadow:0 0 0 1px rgba(0,0,0,.12),0 24px 70px rgba(0,0,0,.4);font-size:13px}
.dark .pw{background:#202020;color:#fff}
.pw .tb{height:40px;background:#F7F8F4;display:flex;align-items:center;padding:0 12px;gap:10px;border-bottom:1px solid rgba(0,0,0,.06)}
.dark .pw .tb{background:#1A1A1A;border-color:rgba(255,255,255,.06)}
.pw .tb .tab{height:30px;padding:0 14px;border-radius:6px;background:#fff;display:flex;align-items:center;gap:8px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.dark .pw .tb .tab{background:#2b2b2b}
.pw .side{position:absolute;left:0;top:40px;bottom:0;width:190px;padding:10px 8px;background:#F7F8F4;font-size:13px}
.dark .pw .side{background:#1c1c1c}
.pw .side div{height:30px;border-radius:5px;display:flex;align-items:center;padding:0 10px;color:#66748A}
.dark .pw .side div{color:rgba(255,255,255,.6)}
.pw .side div.on{background:rgba(0,0,0,.06);color:inherit}
.dark .pw .side div.on{background:rgba(255,255,255,.08)}
.pw .list{position:absolute;left:190px;right:0;top:40px;bottom:0;padding:8px 12px}
.pw .fr{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px}
.pw .fr.sel{background:color-mix(in srgb,#0078D4 16%,transparent)}
.pw .fr .fi{width:20px;height:20px;border-radius:4px}
.pw .fr em{font-style:normal;margin-left:auto;color:#66748A;font-size:12px;width:130px}
.menu{position:absolute;left:470px;top:62px;width:250px;padding:5px;border-radius:8px;background:#F9F9F9;color:#1B1F24;font-size:13px;
  box-shadow:0 0 0 1px rgba(0,0,0,.1),0 12px 32px rgba(0,0,0,.22)}
.dark .menu{background:#2C2C2C;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.5)}
.menu .mi{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px}
.menu .mi svg{width:16px;height:16px;flex:none;color:#66748A}
.menu .mi.hot{background:rgba(0,0,0,.06)}
.dark .menu .mi.hot{background:rgba(255,255,255,.08)}
.menu .mi.hot svg{color:var(--acc)}
.menu .mi kbd{margin-left:auto;font:12px var(--ui);color:#8a94a3}
.menu .sep{height:1px;margin:4px 6px;background:rgba(0,0,0,.08)}
.dark .menu .sep{background:rgba(255,255,255,.08)}
.menu .gc{font-size:11.5px;color:#8a94a3;padding:4px 10px 2px}
.note{position:absolute;left:1060px;top:120px;width:420px;color:#fff;font-size:13.5px;line-height:1.7}
.note h2{font:600 22px var(--disp);margin:0 0 8px}
.note p{margin:0 0 10px;opacity:.9}
.note code{font:12px Consolas,monospace;background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="bar">
  <b>美化桌面 · 视频壁纸</b>
  <div class="grp"><span>视图</span><div class="mseg" id="c-view"><button data-v="drawer">美化桌面抽屉</button><button data-v="menu">Pulse 右键入口</button></div></div>
  <div class="grp"><span>主题</span><div class="mseg" id="c-theme"><button data-v="light">浅色</button><button data-v="dark">深色</button></div></div>
  <div class="grp"><span>分页</span><div class="mseg" id="c-tab"><button data-v="wall">壁纸</button><button data-v="fx">效果</button><button data-v="desk">桌面</button><button data-v="dock">程序坞</button></div></div>
  <div class="grp"><span>视频状态</span><select id="c-state">
    <option value="none">还没选过视频</option>
    <option value="playing">播放中（原片已适合屏幕）</option>
    <option value="optimized">播放中（已优化）</option>
    <option value="optimizing">正在优化</option>
    <option value="paused">自动暂停</option>
    <option value="hevc">缺少 HEVC 扩展</option>
    <option value="missing">文件不见了</option>
    <option value="toobig">太大，转换不了</option>
    <option value="hdr">HDR 视频</option>
    <option value="takeover">未接管图标</option>
    <option value="drop">拖入视频悬停</option>
  </select></div>
</div>
<main>
  <section class="view" id="v-drawer"><div class="fit" id="fit1"><div class="desk" id="desk">
    <div class="wp" id="desk-wp"></div><div class="paused-veil" id="veil"></div>
    <div class="group"><h4>进行中 <span>6</span></h4><div class="icons" id="icons"></div></div>
    <div class="drawer" id="drawer"></div>
    <div class="taskbar"><i></i><i></i><i></i><i></i><i></i><div class="tray">15:42<br>2026/11/26</div></div>
  </div></div></section>
  <section class="view" id="v-menu"><div class="fit" id="fit2"><div class="desk" id="desk2">
    <div class="wp" id="desk2-wp"></div>
    <div class="pw" id="pw"></div>
    <div class="note">
      <h2>在 Pulse 里右键视频</h2>
      <p>在下载、相册里刚找到的视频，右键 → <b>设为桌面壁纸</b>。只有选中 1 个视频文件时出现，归在“桌面整理”一组。</p>
      <p>实现：插件多注册一条文件命令，<code>PULSE_COMMAND_FILES</code> + 扩展名过滤（.mp4 .mov .mkv .m4v .webm .wmv），不需要新接口。</p>
      <p>点下去后：桌面立刻换上这个视频（太大就先显示第一帧、后台优化），美化桌面抽屉不会弹出。</p>
    </div>
  </div></div></section>
</main>
<script>
const Q = new URLSearchParams(location.search);
const S = {view: Q.get('view') || 'drawer', theme: Q.get('theme') || 'light', tab: Q.get('tab') || 'wall',
  state: Q.get('state') || 'optimized', userPaused: false, fill: 0, accAuto: true, mat: 4, gp: 0, rate: 1, lbl: 0, size: 1,
  dbl: true, dock: true, dpos: 0, dhide: 1, dmin: 0, dsys: true, picked: null};

// ---------- scenery (SVG) ----------
// Every instance gets its own gradient ids: a url(#id) pointing into a hidden view stops rendering.
let uid = 0;
const uniq = svg => { const n = ++uid; return svg.replace(/id="(\w+)"/g, `id="$1_${n}"`).replace(/url\(#(\w+)\)/g, `url(#$1_${n})`); };
const scenesRaw = {
  sunset: (anim) => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2A5C"/><stop offset=".45" stop-color="#C9567A"/><stop offset=".72" stop-color="#F59A52"/><stop offset="1" stop-color="#FFD08A"/></linearGradient>
    <linearGradient id="se" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B4A78"/><stop offset="1" stop-color="#1E2246"/></linearGradient>
    <radialGradient id="sn" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".55" stop-color="#FFC56E" stop-opacity=".9"/><stop offset="1" stop-color="#FF9A4A" stop-opacity="0"/></radialGradient></defs>
    <rect width="320" height="112" fill="url(#sk)"/><circle cx="210" cy="104" r="40" fill="url(#sn)"/>
    <g opacity=".55" fill="#fff">${anim?'<animateTransform attributeName="transform" type="translate" from="-30 0" to="30 0" dur="18s" repeatCount="indefinite" additive="sum"/>':''}<ellipse cx="70" cy="38" rx="38" ry="6"/><ellipse cx="250" cy="26" rx="44" ry="5"/><ellipse cx="150" cy="56" rx="30" ry="4"/></g>
    <path d="M0 104 L46 86 L78 98 L120 80 L160 100 L190 92 L230 104 Z" fill="#3B2A55" opacity=".85"/>
    <rect y="104" width="320" height="76" fill="url(#se)"/>
    <g fill="#FFD08A" opacity=".75">${anim?'<animate attributeName="opacity" values=".45;.85;.45" dur="3s" repeatCount="indefinite"/>':''}<rect x="196" y="110" width="28" height="1.2" rx=".6"/><rect x="190" y="118" width="40" height="1.2" rx=".6"/><rect x="200" y="127" width="22" height="1.2" rx=".6"/><rect x="186" y="137" width="48" height="1.2" rx=".6"/></g></svg>`,
  rain: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><rect width="320" height="180" fill="#101826"/>
    <g fill="#1C2A40"><rect x="10" y="40" width="50" height="140"/><rect x="70" y="70" width="40" height="110"/><rect x="120" y="20" width="60" height="160"/><rect x="190" y="60" width="44" height="120"/><rect x="244" y="34" width="66" height="146"/></g>
    <g fill="#FFC86B" opacity=".8"><rect x="20" y="60" width="6" height="4"/><rect x="40" y="90" width="6" height="4"/><rect x="132" y="44" width="6" height="4"/><rect x="152" y="80" width="6" height="4"/><rect x="200" y="84" width="6" height="4"/><rect x="262" y="56" width="6" height="4"/><rect x="284" y="100" width="6" height="4"/></g>
    <rect y="150" width="320" height="30" fill="#0B1220"/><g fill="#FF6B8B" opacity=".5"><rect x="130" y="154" width="40" height="3"/></g><g stroke="#8FB4FF" stroke-opacity=".35" stroke-width="1"><path d="M30 0 l-8 30 M90 10 l-8 30 M160 0 l-8 30 M230 14 l-8 30 M290 4 l-8 30 M60 70 l-8 30 M200 90 l-8 30"/></g></svg>`,
  aurora: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="au" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06121F"/><stop offset="1" stop-color="#0E2A36"/></linearGradient></defs>
    <rect width="320" height="180" fill="url(#au)"/><path d="M0 70 C60 20 120 110 180 50 S280 30 320 60 L320 90 C260 70 200 120 140 80 S40 110 0 100 Z" fill="#3DF5A6" opacity=".45"/>
    <path d="M0 60 C80 40 140 90 220 40 S300 50 320 40 L320 55 C250 70 170 100 100 70 S20 80 0 76 Z" fill="#8AF7D2" opacity=".35"/><path d="M0 150 L60 120 L110 140 L170 112 L230 140 L320 118 L320 180 L0 180 Z" fill="#081A22"/></svg>`,
  snow: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><rect width="320" height="180" fill="#9CC3E8"/><path d="M0 130 L80 50 L120 90 L170 30 L240 110 L320 70 L320 180 L0 180 Z" fill="#E9F1FA"/><path d="M80 50 L100 70 L90 72 Z M170 30 L190 52 L176 54 Z" fill="#fff"/></svg>`,
  system: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="sy" cx=".62" cy=".55" r=".75"><stop offset="0" stop-color="#5F8BD8"/><stop offset=".55" stop-color="#25407A"/><stop offset="1" stop-color="#0D1730"/></radialGradient></defs><rect width="320" height="180" fill="url(#sy)"/><path d="M0 140 C80 110 160 150 240 120 S320 120 320 120 L320 180 L0 180Z" fill="#0B1428" opacity=".7"/></svg>`,
  blue: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="bl" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#4C86F5"/><stop offset=".5" stop-color="#A9C6FA"/><stop offset="1" stop-color="#E4EDFC"/></radialGradient></defs><rect width="320" height="180" fill="url(#bl)"/></svg>`,
  dusk: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="du" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#F08A6E"/><stop offset=".5" stop-color="#F6C0C4"/><stop offset="1" stop-color="#E6D2F0"/></radialGradient></defs><rect width="320" height="180" fill="url(#du)"/></svg>`,
  forest: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="fo" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#3FB27A"/><stop offset=".5" stop-color="#A6D8BE"/><stop offset="1" stop-color="#DCEFE5"/></radialGradient></defs><rect width="320" height="180" fill="url(#fo)"/></svg>`,
  photo: () => `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="ph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3A66A"/><stop offset=".6" stop-color="#F7C994"/><stop offset="1" stop-color="#8B5B86"/></linearGradient></defs><rect width="320" height="180" fill="url(#ph)"/><circle cx="220" cy="70" r="20" fill="#FFF0D0"/><path d="M0 130 L70 80 L120 112 L180 70 L250 120 L320 96 L320 180 L0 180Z" fill="#A0607A"/><path d="M0 150 L320 150 L320 180 L0 180Z" fill="#7A4A70"/></svg>`,
};
const scenes = Object.fromEntries(Object.entries(scenesRaw).map(([k, f]) => [k, a => uniq(f(a))]));
const VIDEOS = [
  {id: 'v0', name: '海边日落.mp4', scene: 'sunset', w: 7680, h: 4320, dur: '0:32'},
  {id: 'v1', name: '雨夜街道.mov', scene: 'rain', w: 3840, h: 2160, dur: '1:05'},
  {id: 'v2', name: '极光.mp4', scene: 'aurora', w: 3840, h: 2160, dur: '0:48'},
];
const PICS = [['system', '系统'], ['blue', '蓝'], ['dusk', '暮色'], ['forest', '森林'], ['photo', '照片']];
const ACC = {sunset: '#F2542D', rain: '#E0507A', aurora: '#1FB98A', system: '#3B78E7', blue: '#3B78E7', dusk: '#E8775A', forest: '#2EA36B', photo: '#D9744A'};

// What each state shows: current wallpaper, the tried video, status line.
function model() {
  const st = S.state;
  const m = {wall: 'v0', tried: null, recent: VIDEOS, kind: 'video', status: null, preview: 'live', chip: '视频', btn: true, acts: [], info: true};
  const v0 = VIDEOS[0], v1 = VIDEOS[1];
  if (st === 'none') Object.assign(m, {wall: 'system', kind: 'pic', recent: [], info: false, chip: null, btn: false});
  else if (st === 'playing') Object.assign(m, {wall: 'v1', status: ['ok', `${v1.w}×${v1.h} · 正在播放`]});
  else if (st === 'optimized') m.status = ['ok', `已为这块屏幕优化成 3840×2160（原片 ${v0.w}×${v0.h}）`];
  else if (st === 'optimizing') Object.assign(m, {preview: 'poster', btn: false, chip: '第一帧', status: ['busy', `正在为这块屏幕优化… 42%`], sub: '原片 7680×4320，优化好之前先显示第一帧', acts: [['取消', '']], progress: 42});
  else if (st === 'paused') Object.assign(m, {preview: 'paused', btn: false, status: ['warn', '全屏程序运行中，已自动暂停'], sub: '“全屏或节能时暂停”在插件设置里'});
  else if (st === 'hevc') Object.assign(m, {tried: 'v2', status: ['err', '需要 HEVC 视频扩展才能播放这个视频'], acts: [['去 Microsoft Store', 'pri']]});
  else if (st === 'missing') Object.assign(m, {preview: 'missing', btn: false, status: ['err', '找不到这个视频，可能已移动或删除'], acts: [['重新选择…', 'pri']]});
  else if (st === 'toobig') Object.assign(m, {tried: 'v2', status: ['err', '这个视频太大，这台电脑转换不了']});
  else if (st === 'hdr') Object.assign(m, {tried: 'v2', status: ['err', '暂不支持 HDR 视频']});
  else if (st === 'takeover') Object.assign(m, {wall: 'system', kind: 'pic', info: false, chip: null, btn: false, takeover: true});
  else if (st === 'drop') Object.assign(m, {drop: true});
  if (S.picked) {  // the user clicked a tile in the mockup
    m.wall = S.picked;
    m.kind = S.picked.startsWith('v') ? 'video' : 'pic';
    if (m.kind === 'pic') Object.assign(m, {chip: null, btn: false, info: false, status: null, tried: null, acts: []});
  }
  return m;
}
const vid = id => VIDEOS.find(v => v.id === id);
const sceneOf = id => id.startsWith('v') ? vid(id).scene : id;

const ico = {
  pal: '<svg class="pal" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5a7.5 7.5 0 1 0 0 15c1 0 1.6-.7 1.6-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5h1.8a3.4 3.4 0 0 0 3.4-3.4C17.5 5.5 14.1 2.5 10 2.5Z"/><circle cx="6.3" cy="9.3" r="1" fill="currentColor"/><circle cx="8.6" cy="6" r="1" fill="currentColor"/><circle cx="12.4" cy="6.2" r="1" fill="currentColor"/></svg>',
  x: '<svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8"/></svg>',
  play: '<svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.8v8.4L10.2 6Z"/></svg>',
  pause: '<svg viewBox="0 0 12 12" fill="currentColor"><rect x="2.5" y="2" width="2.6" height="8" rx=".8"/><rect x="6.9" y="2" width="2.6" height="8" rx=".8"/></svg>',
  plus: '<svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" fill="none"><path d="M8 3v10M3 8h10"/></svg>',
  film: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="20" height="16" rx="3"/><path d="M3 10h20M3 16h20M8 5v16M18 5v16"/></svg>',
  wall: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5 14h6M8 11.5V14"/></svg>',
};

function seg(items, active, key, cls = '') {
  return `<div class="cseg ${cls}">${items.map((t, i) => `<button class="${i === active ? 'on' : ''}" data-set="${key}" data-v="${i}">${t}</button>`).join('')}</div>`;
}
const sw = (on, key) => `<div class="sw ${on ? 'on' : ''}" data-tog="${key}"></div>`;

function wallTab() {
  const m = model();
  const curScene = sceneOf(m.wall);
  let pv = `<div class="img">${scenes[curScene](m.preview === 'live' && !S.userPaused)}</div>`;
  if (m.chip && !m.drop) pv += `<div class="chip">${ico.play}${m.chip}</div>`;
  if (m.btn && !m.drop) pv += `<button class="pbtn" data-act="toggle-pause">${S.userPaused ? ico.play + '播放' : ico.pause + '暂停'}</button>`;
  if (S.userPaused && m.btn) pv += `<div class="veil" style="background:rgba(0,0,0,.18)"></div>`;
  if (m.preview === 'poster') pv += `<div class="prog"><i style="width:${m.progress}%"></i></div>`;
  if (m.preview === 'paused') pv += `<div class="veil">${ico.pause.replace('<svg', '<svg width="22" height="22"')}已暂停</div>`;
  if (m.preview === 'missing') pv += `<div class="veil">找不到视频</div>`;
  if (m.drop) pv += `<div class="drop">${ico.film}<b>松开即设为壁纸</b><span style="color:var(--sec);font-size:12px">雪山延时.mp4</span></div>`;

  const pics = PICS.map(([k, l]) => `<div class="th ${m.wall === k ? 'on' : ''}" data-pick="${k}"><div class="t">${scenes[k]()}</div><span>${l}</span></div>`).join('');
  const dis = m.takeover ? 'dis' : '';
  let vids = m.recent.map(v => `<div class="th ${dis} ${m.wall === v.id ? 'on' : ''}" data-pick="${v.id}"><div class="t">${scenes[v.scene]()}<span class="dur">${v.dur}</span>${m.tried === v.id ? '<i class="warn">!</i>' : ''}</div><span>${v.name.replace(/\.\w+$/, '')}</span></div>`).join('');
  vids += `<div class="th add ${dis}" data-act="choose"><div class="t">${ico.plus}</div><span>选择视频…</span></div>`;

  let info = '';
  if (m.takeover) {
    info = `<div class="info"><div class="st warn"><i class="dot"></i>视频壁纸需要由桌面整理显示图标</div><div class="hint" style="margin-top:4px">现在桌面图标由 Windows 显示，视频会盖住它们。</div><div class="acts"><button class="cbtn pri">开启</button></div></div>`;
  } else if (m.info && m.kind === 'video') {
    const v = vid(m.tried || m.wall);
    if (m.tried) m.sub = `壁纸仍是 ${vid(m.wall).name.replace(/\.\w+$/, '')}`;
    const stLine = m.status ? `<div class="st ${m.status[0] === 'ok' ? '' : m.status[0]}"><i class="dot"></i>${m.status[1]}</div>` : '';
    const acts = m.acts.length ? `<div class="acts">${m.acts.map(([t, c]) => `<button class="cbtn ${c}">${t}</button>`).join('')}</div>` : '';
    const sub = m.sub ? `<div class="hint" style="margin-top:4px">${m.sub}</div>` : '';
    const fill = m.tried ? '' : `<div class="line" style="margin-top:8px;font-size:13px"><span>填充方式</span>${seg(['铺满', '适应'], S.fill, 'fill', 'sm')}</div>`;
    info = `<div class="info"><div class="nm">${v.name}<em>${v.dur}</em></div>${stLine}${sub}${acts}${fill}</div>`;
  } else if (m.kind === 'pic' && !m.recent.length) {
    info = `<div class="hint">选一个视频当壁纸：MP4、MOV、MKV 都可以，也可以把视频文件拖到上面的预览里。比屏幕大的视频会先在后台优化，不占用这么多内存。</div>`;
  }
  return `<div class="pv" id="pv">${pv}</div>
    <div class="cap">图片</div><div class="row">${pics}</div>
    <div class="cap">视频${m.recent.length ? '<span>最近用过</span>' : ''}</div><div class="row">${vids}</div>
    ${info}
    <div class="line" style="margin-top:6px"><span>强调色跟随壁纸</span>${sw(S.accAuto, 'accAuto')}</div>
    ${S.accAuto ? '' : `<div class="sw-row">${['#4CC2FF', '#E68A6E', '#5FD08A', '#A193FF', '#F5A524', '#E5484D'].map((c, i) => `<i style="background:${c};color:${c}" class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>`}`;
}
function fxTab() {
  const glass = S.mat === 4;
  return `<div class="cap">窗口效果</div>${seg(['亚克力', 'Mica', 'Mica Alt', '纯色', '液态玻璃'], S.mat, 'mat')}
    ${glass ? `<div class="cap">液态玻璃风格</div>${seg(['清透', '标准', '柔雾', '棱镜'], S.gp, 'gp')}
    <div class="cap">动态折射</div>${seg(['静态', '30Hz', '60Hz'], S.rate, 'rate')}
    <div class="hint">视频壁纸或动态壁纸下，玻璃按这个频率刷新折射；静态最省电。</div>` : ''}`;
}
function deskTab() {
  const added = [true, false, true];
  return `<div class="cap">图标文字</div>${seg(['阴影', '底板', '隐藏', '正常'], S.lbl, 'lbl')}
    <div class="cap">图标大小</div>${seg(['小', '中', '大'], S.size, 'size')}
    <div class="line" style="margin-top:8px"><span>双击空白处隐藏图标</span>${sw(S.dbl, 'dbl')}</div>
    <div class="cap">小组件<span>放进磁贴区的空位</span></div>
    <div class="wg">${['天气', '日历', '待办'].map((n, i) => `<div class="${added[i] ? 'on' : ''}">${n}<small>${added[i] ? '已添加' : '添加'}</small></div>`).join('')}</div>
    <div class="cap"><a>全部小组件…</a></div>`;
}
function dockTab() {
  return `<div class="line"><span>显示液态玻璃程序坞</span>${sw(S.dock, 'dock')}</div>
    ${S.dock ? `<div class="cap">程序坞位置</div>${seg(['底部', '左侧', '右侧'], S.dpos, 'dpos')}
    <div class="cap">程序坞收回</div>${seg(['常驻', '智能隐藏', '自动隐藏'], S.dhide, 'dhide')}
    <div class="cap">窗口收回效果</div>${seg(['神奇', '缩放', '关闭'], S.dmin, 'dmin')}
    <div class="line" style="margin-top:8px"><span>系统状态与托盘区</span>${sw(S.dsys, 'dsys')}</div>` : ''}`;
}

function renderDrawer() {
  const tabs = [['wall', '壁纸'], ['fx', '效果'], ['desk', '桌面'], ['dock', '程序坞']];
  const body = S.tab === 'wall' ? wallTab() : S.tab === 'fx' ? fxTab() : S.tab === 'desk' ? deskTab() : dockTab();
  document.getElementById('drawer').innerHTML = `<div class="dh">${ico.pal}<h3>美化桌面</h3><button class="x">${ico.x}</button></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="body">${body}</div>`;
}
function renderDesk() {
  const m = model();
  const sc = sceneOf(m.wall);
  document.documentElement.style.setProperty('--acc', S.accAuto ? ACC[sc] : '#4CC2FF');
  const live = m.kind === 'video' && m.preview === 'live' && !S.userPaused;
  document.getElementById('desk-wp').innerHTML = scenes[sc](live);
  document.getElementById('desk2-wp').innerHTML = scenes[sc](live);
  document.getElementById('veil').style.display = (m.preview === 'paused') ? 'block' : 'none';
  const files = [['方案 v3.docx', '#2F6FD6'], ['发布会.pptx', '#D2502E'], ['预算.xlsx', '#21945A'], ['截图 11-26.png', '#8E6AD8'], ['合同扫描.pdf', '#C93C3C'], ['素材', '#E6A93A']];
  document.getElementById('icons').innerHTML = files.map(([n, c]) => `<div class="ic"><div class="f" style="background:${c}"></div>${n}</div>`).join('');
}
function renderMenu() {
  const rows = [['雪山延时.mp4', '2026/11/26 15:12', '#5C7CFA', true], ['雨夜街道.mov', '2026/11/20 21:40', '#5C7CFA'], ['发布会彩排.mp4', '2026/11/18 10:02', '#5C7CFA'],
    ['海报设计.psd', '2026/11/16 09:30', '#2B8FD0'], ['合同扫描.pdf', '2026/11/12 17:05', '#C93C3C'], ['安装包.exe', '2026/11/10 08:44', '#7A869A']];
  const mi = (t, k, hot, icon) => `<div class="mi ${hot ? 'hot' : ''}">${icon || '<svg viewBox="0 0 16 16"></svg>'}${t}${k ? `<kbd>${k}</kbd>` : ''}</div>`;
  document.getElementById('pw').innerHTML = `<div class="tb"><div class="tab">下载</div><div class="tab" style="background:transparent;box-shadow:none;color:#66748A">文档</div></div>
    <div class="side"><div>主页</div><div>桌面</div><div class="on">下载</div><div>文档</div><div>图片</div><div>视频</div></div>
    <div class="list">${rows.map(([n, d, c, sel]) => `<div class="fr ${sel ? 'sel' : ''}"><i class="fi" style="background:${c}"></i>${n}<em>${d}</em></div>`).join('')}</div>
    <div class="menu">${mi('打开', 'Enter')}${mi('快速预览', 'Space')}${mi('打开方式')}${mi('在新标签页打开')}<div class="sep"></div>
      ${mi('暂存到托盘')}${mi('复制', 'Ctrl+C')}${mi('剪切', 'Ctrl+X')}${mi('复制路径')}${mi('重命名', 'F2')}${mi('删除', 'Del')}<div class="sep"></div>
      <div class="gc">桌面整理</div>${mi('设为桌面壁纸', '', true, ico.wall)}<div class="sep"></div>${mi('属性', 'Alt+Enter')}</div>`;
}

function fitAll() {
  for (const [f, d] of [['fit1', 'desk'], ['fit2', 'desk2']]) {
    const el = document.getElementById(f), main = document.querySelector('main');
    const s = Math.min((main.clientWidth - 40) / 1600, (main.clientHeight - 40) / 900, 1.2);
    el.style.transform = `translate(${-800 * s}px,${-450 * s}px) scale(${s})`;
  }
}
function render() {
  document.body.className = S.theme;
  document.querySelectorAll('.desk').forEach(d => d.className = 'desk ' + S.theme);
  for (const [id, key] of [['c-view', 'view'], ['c-theme', 'theme'], ['c-tab', 'tab']])
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === S[key]));
  document.getElementById('c-state').value = S.state;
  document.getElementById('v-drawer').classList.toggle('on', S.view === 'drawer');
  document.getElementById('v-menu').classList.toggle('on', S.view === 'menu');
  renderDesk(); renderDrawer(); renderMenu(); fitAll();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-v],[data-tab],[data-set],[data-tog],[data-pick],[data-act]');
  if (!t) return;
  const bar = t.closest('.mseg');
  if (bar) { S[{'c-view': 'view', 'c-theme': 'theme', 'c-tab': 'tab'}[bar.id]] = t.dataset.v; }
  else if (t.dataset.tab) S.tab = t.dataset.tab;
  else if (t.dataset.set) S[t.dataset.set] = +t.dataset.v;
  else if (t.dataset.tog) S[t.dataset.tog] = !S[t.dataset.tog];
  else if (t.dataset.pick) { S.picked = t.dataset.pick; S.userPaused = false; }
  else if (t.dataset.act === 'toggle-pause') S.userPaused = !S.userPaused;
  render();
});
document.getElementById('c-state').addEventListener('change', e => { S.state = e.target.value; S.picked = null; S.userPaused = false; S.tab = 'wall'; render(); });
addEventListener('resize', fitAll);
render();
</script>
</body>
</html>
