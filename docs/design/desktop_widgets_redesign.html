<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌面整理 · 小组件重设计</title>
<style>
:root{
  --ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;
  --red:#FF3B30; --orange:#FF9500; --amber:#FF9F0A; --green:#30D158; --sun:#FFD60A; --drop:#63C7FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:#111;color:#eee;overflow:hidden}
button{font:inherit;color:inherit}

/* ---------- mockup chrome (not part of Pulse) ---------- */
.bar{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:18px;padding:0 16px;
  background:rgba(18,18,20,.86);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07);z-index:50;font-size:12.5px;color:#c9c9cc}
.bar b{color:#fff;font-weight:600;font-size:13px;margin-right:4px}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:5px;cursor:pointer;color:#bdbdc2;font-size:12px}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.bar .grp{display:flex;align-items:center;gap:6px}
.bar .grp>span{color:#8a8a90}
.bar .sp{flex:1}
main{position:absolute;inset:48px 0 0 0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* ---------- wallpaper ---------- */
.wall{position:absolute;inset:0;overflow:hidden}
.wall svg{width:100%;height:100%;display:block}

/* ---------- desktop view ---------- */
#v-desktop .fit{position:absolute;left:50%;top:50%;transform-origin:0 0}
.desk{position:relative;width:1600px;height:960px;overflow:hidden;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(32,32,34,.72);backdrop-filter:blur(30px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:6px}
.taskbar i{width:36px;height:36px;border-radius:6px;display:block;background:rgba(255,255,255,.08)}
.taskbar i.win{background:none;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:10px}
.taskbar i.win s{background:#4cc2ff;border-radius:1px}
.taskbar .tray{position:absolute;right:14px;font-size:12px;color:#fff;text-align:right;line-height:1.35}
.board{position:absolute}
.hint{position:absolute;left:28px;top:24px;width:420px;color:#fff;font-size:13px;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.hint h2{font:600 22px/1.3 var(--disp);margin:0 0 6px}
.hint p{margin:0 0 4px;opacity:.88}
.hint kbd{font:600 11px var(--ui);background:rgba(255,255,255,.18);border-radius:4px;padding:1px 5px}

/* ---------- widget base ---------- */
.w{position:absolute;border-radius:22px;overflow:hidden;color:var(--ink);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;user-select:none;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.w[data-size="1x1"]{border-radius:20px}
.w .wc{position:absolute;inset:0;padding:14px}
.w[data-size="1x1"] .wc{padding:11px}
.w .bgl{position:absolute;inset:0}
.w:active{transform:scale(.985)}
.num{font-variant-numeric:tabular-nums}

/* materials: one recipe, three inks */
.w.m-dark{--ink:#fff;--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.38);--hair:rgba(255,255,255,.13);--track:rgba(255,255,255,.16);--fill:rgba(255,255,255,.12);--fill2:rgba(255,255,255,.2);
  background:rgba(28,28,30,.42);backdrop-filter:blur(30px) saturate(1.7);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.17),inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -12px rgba(0,0,0,.45)}
.w.m-light{--ink:#1d1d1f;--ink2:rgba(0,0,0,.54);--ink3:rgba(0,0,0,.32);--hair:rgba(0,0,0,.08);--track:rgba(0,0,0,.09);--fill:rgba(0,0,0,.06);--fill2:rgba(0,0,0,.1);
  background:rgba(250,250,248,.64);backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.75),0 14px 34px -12px rgba(0,0,0,.32)}
.w.m-tint{--ink:#fff;--ink2:rgba(255,255,255,.72);--ink3:rgba(255,255,255,.46);--hair:rgba(255,255,255,.18);--track:rgba(255,255,255,.22);--fill:rgba(255,255,255,.16);--fill2:rgba(255,255,255,.26);
  background:color-mix(in srgb,var(--tint) 64%,rgba(16,16,18,.35));backdrop-filter:blur(30px) saturate(1.6);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),0 14px 34px -12px rgba(0,0,0,.45)}
.w.fx-solid{backdrop-filter:none}
.w.fx-solid.m-dark{background:#1c1c1e}
.w.fx-solid.m-light{background:#fff}
.w.fx-solid.m-tint{background:var(--tint)}
.w.sky{--ink:#fff;--ink2:rgba(255,255,255,.78);--ink3:rgba(255,255,255,.5);--hair:rgba(255,255,255,.22);--track:rgba(255,255,255,.22);--fill:rgba(255,255,255,.18)}
.w.paper{--ink:#3a3320;--ink2:rgba(58,51,32,.6);--ink3:rgba(58,51,32,.38)}
.w.paper.pd{--ink:#f3eedc;--ink2:rgba(243,238,220,.62);--ink3:rgba(243,238,220,.36)}
.w.photo{--ink:#fff;--ink2:rgba(255,255,255,.8)}

/* type scale */
.t-lab{font:600 12px/16px var(--ui);color:var(--ink2)}
.t-cap{font:500 11px/14px var(--ui);color:var(--ink2)}
.t-body{font:600 13px/17px var(--ui)}
.t-red{color:var(--red)}
.t-hero{font:300 46px/1 var(--disp);letter-spacing:-.025em}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.abs{position:absolute}
.bar-t{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.bar-t>i{display:block;height:100%;border-radius:2px;background:var(--ink)}
.dots{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.dots i.on{background:var(--ink)}
.ibtn{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.ibtn:hover{background:var(--fill2)}
.ibtn.plain{background:transparent}
.skel{background:var(--fill);border-radius:5px}
.skel.anim{animation:sk 1.4s ease-in-out infinite}
@keyframes sk{50%{opacity:.45}}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px;color:var(--ink2)}
.empty b{color:var(--ink);font:600 13px var(--ui)}
.empty span{font-size:11.5px;line-height:1.45}
.fileic{flex:none}
.todo-i{display:flex;align-items:center;gap:9px;height:26px;cursor:pointer}
.todo-i .c{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;display:grid;place-items:center}
.todo-i.done .c{background:var(--tint,#0A84FF);border-color:transparent}
.todo-i.done span{color:var(--ink3);text-decoration:line-through}
.todo-i span{font:500 13px/17px var(--ui)}
.pill{height:30px;padding:0 14px;border-radius:15px;border:0;background:var(--fill);color:var(--ink);font:600 12.5px var(--ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.pill:hover{background:var(--fill2)}
.chipkey{font:600 10.5px var(--ui);padding:1px 5px;border-radius:4px;background:var(--fill);color:var(--ink2)}

/* ---------- gallery ---------- */
#v-gallery .wall{position:fixed;top:48px}
#v-gallery .scroll{position:absolute;inset:0;overflow:auto;padding:28px 40px 80px}
.gsec{margin:0 auto 34px;max-width:1500px}
.gsec .gh{display:inline-block;background:rgba(10,10,14,.42);backdrop-filter:blur(14px);border-radius:8px;padding:7px 12px 8px;margin:0 0 12px}
.gsec h3{font:600 15px var(--disp);color:#fff;margin:0 0 2px}
.gsec .gd{font-size:12px;color:rgba(255,255,255,.8);margin:0}
.gsec .gl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px}
.gitem{display:flex;flex-direction:column;gap:6px}
.gitem .wbox{position:relative}
.gitem .wbox .w{position:relative}
.gitem label{align-self:flex-start;font-size:11px;color:#fff;background:rgba(10,10,14,.4);border-radius:4px;padding:0 6px;line-height:17px}
.gintro{max-width:1500px;margin:0 auto 26px;color:#fff;background:rgba(10,10,14,.45);backdrop-filter:blur(16px);border-radius:12px;padding:16px 20px}
.gintro h2{font:600 24px var(--disp);margin:0 0 8px}
.gintro ol{margin:0;padding-left:20px;font-size:13px;line-height:1.75;opacity:.92;columns:2;column-gap:40px}

/* ---------- context menu & edit sheet (Pulse flyout tokens) ---------- */
.menu{position:fixed;z-index:80;min-width:220px;padding:4px;border-radius:8px;font:13px var(--ui);display:none}
body.pt-dark .menu,body.pt-dark .sheet{background:rgba(44,44,44,.96);color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
body.pt-light .menu,body.pt-light .sheet{background:rgba(249,249,249,.98);color:#1b1b1b;box-shadow:0 8px 32px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.06)}
.menu .mi{height:32px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:4px;cursor:default;position:relative}
.menu .mi:hover{background:var(--mh)}
body.pt-dark{--mh:rgba(255,255,255,.08)}
body.pt-light{--mh:rgba(0,0,0,.05)}
.menu .mi .k{margin-left:auto;opacity:.55;font-size:12px}
.menu .ms{height:1px;margin:4px 0;background:currentColor;opacity:.1}
.menu .mi svg{opacity:.85}
.menu .mi.danger{color:#ff6b5e}
body.pt-light .menu .mi.danger{color:#c42b1c}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px 8px}
.sizes button{border:0;background:var(--mh);border-radius:6px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;cursor:pointer;opacity:.9}
.sizes button.on{outline:1.5px solid #4cc2ff}
.sizes button i{display:block;border:1.5px solid currentColor;border-radius:3px;opacity:.7}
.sheet{position:fixed;z-index:79;width:300px;border-radius:12px;padding:16px;display:none;font:13px var(--ui)}
.sheet h4{margin:0 0 2px;font:600 15px var(--disp)}
.sheet .sd{font-size:12px;opacity:.62;margin-bottom:12px}
.sheet .f{margin:0 0 12px}
.sheet .f>div:first-child{font-size:12px;opacity:.75;margin-bottom:6px}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* ---------- Pulse settings window ---------- */
#v-settings{background:var(--pbg2)}
body.pt-dark{--pbg:#1A1A1A;--pbg2:#141414;--psheet:#202020;--pcard:#272727;--pstroke:rgba(255,255,255,.06);--ptext:#fff;--ptext2:rgba(255,255,255,.61);--ptext3:rgba(255,255,255,.4);--pinput:rgba(255,255,255,.06);--pinput2:rgba(255,255,255,.09);--pdiv:rgba(255,255,255,.06);--psel:rgba(76,194,255,.12);--pacc:#4CC2FF;--paccfill:#4CC2FF;--paccink:#000;--phover:rgba(255,255,255,.05)}
body.pt-light{--pbg:#F3F5F1;--pbg2:#E6EAE3;--psheet:#F7F8F4;--pcard:#FFFFFF;--pstroke:#DCE3D9;--ptext:#303B50;--ptext2:#66748A;--ptext3:#929CAE;--pinput:rgba(255,255,255,.9);--pinput2:#fff;--pdiv:rgba(82,125,112,.12);--psel:rgba(0,120,212,.095);--pacc:#0067C0;--paccfill:#0067C0;--paccink:#fff;--phover:rgba(82,125,112,.055)}
.pwin{position:absolute;inset:18px 24px;border-radius:8px;overflow:hidden;background:var(--pbg);color:var(--ptext);box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 0 1px var(--pstroke);display:flex;flex-direction:column}
.ptitle{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.ptitle .lg{width:22px;height:22px}
.ptitle .nm{font-weight:600;font-size:13px}
.ptitle .tab{margin-left:14px;height:32px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:7px 7px 0 0;font-size:12.5px;color:var(--ptext2)}
.ptitle .tab.on{background:var(--psheet);color:var(--ptext)}
.ptitle .wc{margin-left:auto;display:flex;gap:26px;color:var(--ptext2);font-size:12px;padding-right:6px}
.pbody{flex:1;display:flex;min-height:0;background:var(--psheet)}
.pnav{width:244px;flex:none;padding:12px 8px;overflow:hidden;display:flex;flex-direction:column}
.pnav .srch{margin:2px 8px 10px;height:32px;border-radius:5px;background:var(--pinput);border:1px solid var(--pstroke);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12.5px;color:var(--ptext3)}
.pnav .gh{font-size:11.5px;color:var(--ptext2);padding:10px 14px 4px}
.pnav .ni{height:36px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:6px;font-size:13px;position:relative;color:var(--ptext)}
.pnav .ni svg{opacity:.8}
.pnav .ni.on{background:var(--psel)}
.pnav .ni.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--pacc)}
.pnav .ver{margin-top:auto;font-size:11.5px;color:var(--ptext2);padding:8px 14px}
.pcontent{flex:1;overflow:auto;padding:20px 28px 60px 24px}
.pgrid{display:flex;gap:20px;align-items:flex-start;max-width:1300px}
.pmain{flex:1;min-width:0}
.pside{width:462px;flex:none;position:sticky;top:0}
.crumb{font:600 26px/1.25 var(--disp);margin:0 0 4px;display:flex;align-items:center;gap:10px}
.crumb span{color:var(--ptext2);font-weight:400}
.pintro{font-size:13px;color:var(--ptext2);margin:0 0 16px}
.psel{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px}
.pselect{height:32px;min-width:200px;border-radius:5px;background:var(--pinput);border:1px solid var(--pstroke);display:flex;align-items:center;padding:0 10px;gap:8px}
.pselect svg{margin-left:auto;opacity:.6}
.psec{font:600 14px var(--ui);margin:18px 0 8px}
.pcard{background:var(--pcard);border-radius:7px;box-shadow:0 0 0 1px var(--pstroke)}
.prow{display:flex;align-items:center;gap:16px;padding:14px 18px;min-height:64px}
.prow+.prow{border-top:1px solid var(--pdiv)}
.prow .tx{flex:1;min-width:0}
.prow .tt{font-size:13.5px}
.prow .dd{font-size:12px;color:var(--ptext2);margin-top:2px;line-height:1.45}
.prow.stack{flex-direction:column;align-items:stretch;gap:10px}
.pseg{display:inline-flex;background:var(--pinput);border:1px solid var(--pstroke);border-radius:6px;padding:3px;gap:2px;flex:none}
.pseg button{border:0;background:transparent;height:28px;padding:0 14px;border-radius:4px;font-size:12.5px;cursor:pointer;color:var(--ptext);position:relative;white-space:nowrap}
.pseg button.on{background:var(--pcard);box-shadow:0 0 0 1px var(--pstroke),0 1px 2px rgba(0,0,0,.08);font-weight:600}
.pseg button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--pacc)}
.psw{width:40px;height:20px;border-radius:10px;border:1px solid var(--ptext2);position:relative;cursor:pointer;flex:none;background:transparent}
.psw::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;left:3px;top:3px;background:var(--ptext2);transition:left .15s}
.psw.on{background:var(--paccfill);border-color:var(--paccfill)}
.psw.on::after{left:23px;background:var(--paccink);width:12px}
.pin{height:32px;border-radius:5px;background:var(--pinput);border:1px solid var(--pstroke);border-bottom-color:var(--ptext3);padding:0 10px;font:13px var(--ui);color:var(--ptext);outline:none;width:220px}
.pin:focus{border-bottom:2px solid var(--pacc)}
.pbtn{height:32px;padding:0 14px;border-radius:5px;border:1px solid var(--pstroke);background:var(--pinput2);font-size:12.5px;cursor:pointer;color:var(--ptext);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pbtn.pri{background:var(--paccfill);color:var(--paccink);border-color:transparent}
.ptabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--pdiv);overflow-x:auto}
.ptabs button{border:0;background:transparent;height:34px;padding:0 12px;font-size:13px;color:var(--ptext2);cursor:pointer;position:relative;white-space:nowrap;display:flex;align-items:center;gap:7px}
.ptabs button.on{color:var(--ptext);font-weight:600}
.ptabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:2px;background:var(--pacc)}
.optcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.optc{border-radius:7px;box-shadow:0 0 0 1px var(--pstroke);padding:8px 8px 9px;cursor:pointer;display:flex;flex-direction:column;gap:7px;align-items:center;font-size:12.5px;background:var(--pinput)}
.optc.on{box-shadow:0 0 0 2px var(--pacc)}
.optc .pv{width:100%;height:74px;border-radius:5px;position:relative;overflow:hidden}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatches button.on{box-shadow:0 0 0 2px var(--pcard),0 0 0 4px var(--pacc)}
.swatches .auto{width:auto;border-radius:13px;padding:0 10px;font-size:12px;background:var(--pinput);color:var(--ptext);box-shadow:0 0 0 1px var(--pstroke)}
.swatches .auto.on{box-shadow:0 0 0 2px var(--pacc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:30px;border-radius:15px;padding:0 6px 0 12px;display:inline-flex;align-items:center;gap:6px;background:var(--pinput);box-shadow:0 0 0 1px var(--pstroke);font-size:12.5px}
.chip small{color:var(--ptext2);font-size:11.5px}
.chip button{border:0;background:transparent;width:20px;height:20px;border-radius:50%;cursor:pointer;color:var(--ptext2);display:grid;place-items:center;padding:0}
.chip button:hover{background:var(--phover)}
.chip.add{padding:0 12px;cursor:pointer;color:var(--pacc)}
.pcheck{display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-right:18px;cursor:pointer}
.pcheck i{width:18px;height:18px;border-radius:4px;border:1px solid var(--ptext2);display:grid;place-items:center}
.pcheck.on i{background:var(--paccfill);border-color:var(--paccfill);color:var(--paccink)}
.pslider{display:flex;flex-direction:column;gap:4px;width:300px;flex:none}
.pslider input{width:100%;accent-color:var(--pacc)}
.pslider .st{display:flex;justify-content:space-between;font-size:11px;color:var(--ptext2)}
.pslider .cur{font-size:12px;color:var(--ptext);text-align:right}
.preview{border-radius:8px;overflow:hidden;position:relative;height:auto}
.preview .wall{position:absolute;inset:0}
.preview .pvin{position:relative;padding:16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.preview .pvin .w{position:relative}
.pvcap{font-size:12px;color:var(--ptext2);margin:8px 2px 0;line-height:1.5}
.pnew{display:inline-block;font:600 10px var(--ui);color:var(--pacc);border:1px solid var(--pacc);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.pmuted{opacity:.5;pointer-events:none}

/* ---------- liquid glass (the widgets' default effect) ---------- */
.w.fx-liquid.m-dark{background:rgba(18,18,24,.20);backdrop-filter:blur(7px) saturate(1.9) brightness(.92);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.13),inset 0 -14px 24px -18px rgba(255,255,255,.35),inset 10px 0 18px -16px rgba(255,255,255,.25),0 14px 34px -12px rgba(0,0,0,.5)}
.w.fx-liquid.m-light{background:rgba(255,255,255,.30);backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.45),inset 0 -14px 24px -18px rgba(255,255,255,.6),0 14px 34px -12px rgba(0,0,0,.28)}
.w.fx-liquid.m-tint{background:color-mix(in srgb,var(--tint) 50%,rgba(16,16,18,.15));backdrop-filter:blur(7px) saturate(1.8);

function monthGrid(d, cell, withLunar, fs = 12) {
  const y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() - S.weekStart + 7) % 7;
  const hdr = Array.from({ length: 7 }, (_, i) => { const wd = (i + S.weekStart) % 7; return `<div style="text-align:center;font:700 10px var(--ui);color:${wd === 0 || wd === 6 ? 'var(--ink3)' : 'var(--ink2)'}">${WD1[wd]}</div>`; }).join('');
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div></div>';
  for (let dd = 1; dd <= days; dd++) {
    const x = new Date(y, m, dd), today = dd === d.getDate(), wd = x.getDay(), we = wd === 0 || wd === 6;
    const L = withLunar ? lunar(x) : null;
    cells += `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:${cell}px"><span class="num" style="width:${fs * 1.9}px;height:${fs * 1.9}px;border-radius:50%;display:grid;place-items:center;font:600 ${fs}px var(--ui);${today ? 'background:var(--red);color:#fff' : we ? 'color:var(--ink2)' : ''}">${dd}</span>${L ? `<span style="font:500 9px/1 var(--ui);margin-top:1px;color:${L.fest ? 'var(--red)' : 'var(--ink3)'}">${L.cell}</span>` : ''}</div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);row-gap:0">${hdr}${cells}</div>`;
}

function countdownCalc(o) {

  const mdays = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(), monP = (d.getDate() - 1 + dayP) / mdays;

  return { title: o.cdTitle || '元旦', target, days, dayP, weekP, monP, yearP };
}

/* ================= tile wrapper ================= */
function mode(o = {}) { const s = o.scheme || S.scheme; if (s === 'auto') return S.theme === 'light' ? 'light' : 'dark'; return s; }
const REG = {};
let TID = 0;
function tile(kind, c, r, o = {}) {
  const id = o.id || ('t' + (TID++)); REG[id] = { kind, c, r, o: { ...o, id } };
  return tileHTML(id);
}
function tileHTML(id) {
  const { c, r, o } = REG[id]; let kind = REG[id].kind;
  const ov = TILE_OPTS[id] || {}; const oo = { ...o, ...ov };
  if (o.stack) kind = o.stack[STACKS[id] || 0];
  const w = U(c), h = U(r), k = c + 'x' + r;
  let body;
  try { body = R[kind](k, w, h, oo) || {}; } catch (e) { body = { html: '<div class="t-cap">' + e.message + '</div>' }; console.error(e); }
  const m = mode(oo);
  const dots = o.stack ? `<div class="dots">${o.stack.map((_, i) => `<i class="${i === (STACKS[id] || 0) ? 'on' : ''}"></i>`).join('')}</div>` : '';
  const pos = o.x != null ? `left:${o.x}px;top:${o.y}px;` : '';
  return `<div class="w m-${m} fx-${S.fx} ${body.cls || ''}" id="${id}" data-kind="${kind}" data-size="${k}" style="${pos}width:${w}px;height:${h}px;--tint:${tintColor()}">${body.bg || ''}<div class="wc" ${body.nopad ? 'style="padding:0"' : ''}>${body.html}</div>${dots}</div>`;
}
function refresh(filter) {
  document.querySelectorAll('.w[id]').forEach(el => { const reg = REG[el.id]; if (!reg) return; const kind = reg.o.stack ? reg.o.stack[STACKS[el.id] || 0] : reg.kind; if (filter && !filter(kind, el)) return; if (el.contains(document.activeElement) && document.activeElement.isContentEditable) return; el.outerHTML = tileHTML(el.id); });
}

    ${OUTS.map(o => row(ic(o.k === 'hp' ? 'phones' : 'speaker', 16), o.n, o.d, D.out === o.k ? '✓' : '', D.out === o.k, 'out:' + o.k)).join('')}
    <div class="dk-hr"></div><div class="dk-link">音量合成器（每个应用的音量）…</div>`;
  if (key === 'bt') return `<h5>蓝牙${toggle(D.bt, 'bt-toggle')}</h5><div class="sub">${D.bt ? '电量和“电池”小组件读的是同一份' : '已关闭'}</div>
    ${D.bt ? BTDEV.map(b => row(ic(b.k, 16), b.n, b.on ? '已连接' : '已配对，未连接', b.on ? `${b.p}%` : '连接', b.on, '')).join('') : ''}
    <div class="dk-hr"></div><div class="dk-link">添加设备…</div>`;
  if (key === 'batt') return `<h5>电池<span style="font:600 13px var(--ui)">76%</span></h5><div class="sub">正在充电 · 大约 48 分钟充满</div>
    <div style="margin:4px 8px 8px;font:600 12px var(--ui);color:var(--ink2)">电源模式</div>
    <div style="display:flex;gap:6px;padding:0 8px">${['节能', '平衡', '性能'].map((x, i) => `<div data-dact="power:${i}" style="flex:1;text-align:center;padding:8px 0;border-radius:10px;cursor:pointer;font:600 12.5px var(--ui);background:${D.power === i ? 'var(--on)' : 'var(--fill)'};color:${D.power === i ? 'var(--on-ink)' : 'var(--ink)'}">${x}</div>`).join('')}</div>
    <div class="dk-hr"></div><div class="dk-link">电源和电池设置…</div>`;
  if (key === 'time') {
    const d = now(), L = lunar(d), y = d.getFullYear(), m = d.getMonth(), first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
    let cells = '一二三四五六日'.split('').map(x => `<span class="h">${x}</span>`).join('');
    for (let i = 0; i < lead; i++) cells += '<span></span>';
    for (let k = 1; k <= days; k++) cells += `<span>${k === d.getDate() ? `<span class="t">${k}</span>` : k}</span>`;
    return `<h5>${d.getMonth() + 1}月${d.getDate()}日 ${WD[d.getDay()]}<span style="font:500 12px var(--ui);color:var(--ink2)">${hm(d)}</span></h5><div class="sub">农历${L.m}${L.d}</div>
      <div class="cal7">${cells}</div><div class="dk-hr"></div>
      ${row(ic('bell', 16), '2 条通知', '微信：王老师 “评审改到 3 点” · 下载完成：季度报告 Q3.pdf', '', false)}
      <div class="dk-link">打开通知中心…</div>`;
  }
  return '';
}
function renderDockPanel() {
  const host = document.getElementById('dpanel');
  if (!host) return;
  if (!D.panel) { host.innerHTML = ''; return; }
  const key = D.panel.startsWith('tray:') ? `[data-tray="${D.panel.slice(5)}"]` : `[data-st="${D.panel}"]`;
  const anchor = document.querySelector('#dock ' + key);
  if (!anchor) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="dk-panel ${dockInk()}" id="dkp">${panelHtml(D.panel)}</div>`;
  const desk = document.getElementById('ddesk'), dr = desk.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), dockR = document.getElementById('dock').getBoundingClientRect();
  const k = dr.width / 1600, p = document.getElementById('dkp'), pw = 312, ph = p.offsetHeight;
  let x, y;
  if (D.pos === 'bottom') { x = (ar.left + ar.width / 2 - dr.left) / k - pw / 2; y = (dockR.top - dr.top) / k - ph - 12; }
  else if (D.pos === 'left') { x = (dockR.right - dr.left) / k + 12; y = (ar.top + ar.height / 2 - dr.top) / k - ph / 2; }
  else { x = (dockR.left - dr.left) / k - pw - 12; y = (ar.top + ar.height / 2 - dr.top) / k - ph / 2; }
  p.style.left = Math.max(12, Math.min(1600 - pw - 12, x)) + 'px'; p.style.top = Math.max(12, Math.min(960 - ph - 12, y)) + 'px';
}
function showOsd() {
  const host = document.getElementById('dpanel'), dock = document.getElementById('dock');
  if (!host || !dock) return;
  let o = document.getElementById('osd');
  if (!o) { o = document.createElement('div'); o.id = 'osd'; o.className = 'osd ' + dockInk() + ' dk-panel'; o.style.width = 'auto'; host.appendChild(o); }
  o.innerHTML = `${volGlyph(18)}<div class="bar"><i style="width:${D.muted ? 0 : D.vol}%"></i></div><span>${D.muted ? '静音' : D.vol}</span>`;
  const desk = document.getElementById('ddesk').getBoundingClientRect(), dr = dock.getBoundingClientRect(), k = desk.width / 1600;
  o.style.left = ((dr.left + dr.width / 2 - desk.left) / k) + 'px'; o.style.top = ((dr.top - desk.top) / k - 56) + 'px';
  clearTimeout(D.osd); D.osd = setTimeout(() => o.remove(), 1200);
}
function fitBox(id) { const f = document.getElementById(id), m = document.querySelector('main'); if (!f) return; const s = Math.min((m.clientWidth - 40) / 1600, (m.clientHeight - 40) / 960); f.style.left = '50%'; f.style.top = '50%'; f.style.transformOrigin = 'center'; f.style.transform = `translate(-50%,-50%) scale(${s})`; }

// interactions
document.addEventListener('click', e => {
  if (S.view !== 'dock') return;
  const st = e.target.closest('[data-st]'), tr = e.target.closest('[data-tray]'), act = e.target.closest('[data-dact]');
  if (act) {
    const a = act.dataset.dact;
    if (a === 'wifi-toggle') D.wifi = !D.wifi;
    else if (a === 'bt-toggle') D.bt = !D.bt;
    else if (a === 'mute') D.muted = !D.muted;
    else if (a === 'ime-toggle') D.ime = D.ime === '中' ? '英' : '中';
    else if (a === 'vol-bar') { const r = act.getBoundingClientRect(); D.vol = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100); D.muted = false; }
    else if (a.startsWith('net:')) { const n = a.slice(4); if (n !== D.net) { D.net = n; D.joining = n; setTimeout(() => { D.joining = ''; renderDock(); }, 1200); } }
    else if (a.startsWith('out:')) D.out = a.slice(4);
    else if (a.startsWith('power:')) D.power = +a.slice(6);
    else if (a.startsWith('pin:')) { const n = a.slice(4); D.trayPinned = D.trayPinned.includes(n) ? D.trayPinned.filter(x => x !== n) : [...D.trayPinned, n]; }
    else if (a.startsWith('open:')) D.panel = '';
    else if (a.startsWith('unpin:')) { D.trayPinned = D.trayPinned.filter(x => x !== a.slice(6)); D.panel = ''; }
    renderDock(); return;
  }
  if (st) {
    const k = st.dataset.st;
    if (k === 'ime') { D.ime = D.ime === '中' ? '英' : '中'; D.panel = D.panel === 'ime' ? 'ime' : ''; renderDock(); return; }
    D.panel = D.panel === k ? '' : k; renderDock(); return;
  }
  if (tr) { D.panel = ''; renderDock(); return; }   // left click opens the app itself
  if (!e.target.closest('#dkp')) { if (D.panel) { D.panel = ''; renderDock(); } }
});
document.addEventListener('contextmenu', e => {
  if (S.view !== 'dock') return;
  const st = e.target.closest('[data-st="ime"]'), tr = e.target.closest('[data-tray]');
  if (st) { e.preventDefault(); D.panel = 'ime'; renderDock(); }
  else if (tr) { e.preventDefault(); D.panel = 'tray:' + tr.dataset.tray; renderDock(); }
}, true);
document.addEventListener('wheel', e => {
  if (S.view !== 'dock') return;
  const st = e.target.closest('[data-st="vol"]');
  if (!st) return;
  e.preventDefault();
  D.vol = Math.max(0, Math.min(100, D.vol + (e.deltaY < 0 ? 2 : -2))); D.muted = false;
  const keep = D.panel; renderDock(); D.panel = keep; showOsd();
}, { passive: false });
document.addEventListener('mousemove', e => {
  if (S.view !== 'dock') return;
  const dock = document.getElementById('dock');
  if (!dock) return;
  const vertical = D.pos !== 'bottom', r = dock.getBoundingClientRect();
  const inside = e.clientX >= r.left - 20 && e.clientX <= r.right + 20 && e.clientY >= r.top - 40 && e.clientY <= r.bottom + 10;
  dock.querySelectorAll('.dk-app').forEach(a => {
    if (!inside) { a.style.transform = ''; return; }
    const ar = a.getBoundingClientRect(), c = vertical ? ar.top + ar.height / 2 : ar.left + ar.width / 2;
    const dist = Math.abs((vertical ? e.clientY : e.clientX) - c) / ar.width;
    const s = 1 + 0.42 * Math.max(0, Math.cos(Math.min(dist, 2.6) / 2.6 * Math.PI / 2)) ** 2;
    a.style.transform = `scale(${s.toFixed(3)})`;
  });
});
setInterval(() => { if (S.view === 'dock') { const t = document.querySelector('#dock [data-st="time"] b'); if (t) t.textContent = hm(now()); } }, 1000);

addEventListener('error', e => { document.body.dataset.err = (document.body.dataset.err || '') + e.message + ' | '; });
render();
// ?demo=menu|edit shows the right-click menu / edit sheet (for screenshots and reviews)
if (S.view === 'desktop' && Q.get('demo')) setTimeout(() => {
  const target = document.getElementById(Q.get('demo') === 'menu' ? 'd-cal' : (Q.get('tile') || 'd-photos'));
  if (!target) return; const r = target.getBoundingClientRect();
  if (Q.get('demo') === 'menu') openMenu(target, r.left + r.width * .55, r.top + r.height * .4);
  else { target.classList.add('editing'); openSheet(target.id); }
}, 50);
</script>
