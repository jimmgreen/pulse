<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse 文件操作</title>
<style>
/* Layout: controls → live Pulse window with the operation dialog floating over it → status-pill state strip → spec cards. Tokens from FluentTokens.h MakeTheme. */
:root {
  --bg: #F3F5F1; --title: #F1F3EE; --sheet: #F7F8F4; --card: #FFFFFF; --flyout: #FFFFFF; --status: #F7F8F4; --dlg: #F9FAF7;
  --text: #303B50; --text2: #66748A; --text3: #929CAE;
  --hover: rgba(82,125,112,.055); --pressed: rgba(82,125,112,.09);
  --stroke: #DCE3D9; --divider: #E5EAE3; --input: rgba(255,255,255,.9);
  --accent: #0078D4; --accent-fg: #0067C0; --accent-soft: rgba(0,120,212,.095); --accent-soft2: rgba(0,120,212,.17); --on-accent: #FFFFFF;
  --sel-a: rgba(0,120,212,.30); --sel-b: rgba(0,120,212,.08); --sel-line: #0078D4;
  --folder: #BCA270; --file: #839FC4; --img: #5E9C7E; --zip: #B98A4B; --doc: #8A97AA;
  --ok: #0F7B0F; --ok-soft: rgba(15,123,15,.10); --warn: #9D5D00; --warn-soft: rgba(157,93,0,.10); --danger: #C42B1C; --danger-soft: rgba(196,43,28,.09); --danger-fill: #C42B1C;
  --graph-track: rgba(82,125,112,.10);
  --shadow: 0 8px 24px rgba(48,59,80,.16), 0 1px 3px rgba(48,59,80,.10);
  --dlg-shadow: 0 24px 64px rgba(48,59,80,.26), 0 2px 8px rgba(48,59,80,.14);
  --win-shadow: 0 18px 50px rgba(48,59,80,.16);
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  --icons: "Segoe Fluent Icons", "Segoe MDL2 Assets";
  --mono: "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1A1A; --title: #1A1A1A; --sheet: #202020; --card: #272727; --flyout: #2B2B2B; --status: #151515; --dlg: #242424;
    --text: #FFFFFF; --text2: rgba(255,255,255,.606); --text3: rgba(255,255,255,.40);
    --hover: rgba(255,255,255,.08); --pressed: rgba(255,255,255,.06);
    --stroke: rgba(255,255,255,.07); --divider: rgba(255,255,255,.06); --input: rgba(255,255,255,.06);
    --accent: #0078D4; --accent-fg: #5AAAE6; --accent-soft: rgba(64,154,223,.17); --accent-soft2: rgba(64,154,223,.28); --on-accent: #FFFFFF;
    --sel-a: rgba(64,154,223,.45); --sel-b: rgba(64,154,223,.12); --sel-line: #5AAAE6;
    --folder: #FFCD70; --file: #78B0E8; --img: #7CC4A0; --zip: #E0B070; --doc: #B7C0CC;
    --ok: #6CCB5F; --ok-soft: rgba(108,203,95,.14); --warn: #FCE100; --warn-soft: rgba(252,225,0,.12); --danger: #FF99A4; --danger-soft: rgba(255,153,164,.12);
    --graph-track: rgba(255,255,255,.07);
    --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.35);
    --dlg-shadow: 0 28px 70px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
    --win-shadow: 0 18px 50px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1A1A; --title: #1A1A1A; --sheet: #202020; --card: #272727; --flyout: #2B2B2B; --status: #151515; --dlg: #242424;
  --text: #FFFFFF; --text2: rgba(255,255,255,.606); --text3: rgba(255,255,255,.40);
  --hover: rgba(255,255,255,.08); --pressed: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.07); --divider: rgba(255,255,255,.06); --input: rgba(255,255,255,.06);
  --accent: #0078D4; --accent-fg: #5AAAE6; --accent-soft: rgba(64,154,223,.17); --accent-soft2: rgba(64,154,223,.28); --on-accent: #FFFFFF;
  --sel-a: rgba(64,154,223,.45); --sel-b: rgba(64,154,223,.12); --sel-line: #5AAAE6;
  --folder: #FFCD70; --file: #78B0E8; --img: #7CC4A0; --zip: #E0B070; --doc: #B7C0CC;
  --ok: #6CCB5F; --ok-soft: rgba(108,203,95,.14); --warn: #FCE100; --warn-soft: rgba(252,225,0,.12); --danger: #FF99A4; --danger-soft: rgba(255,153,164,.12);
  --graph-track: rgba(255,255,255,.07);
  --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.35);
  --dlg-shadow: 0 28px 70px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --win-shadow: 0 18px 50px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); padding-inline: 16px; padding-block: 20px 48px; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 1px; }
.ic { font-family: var(--icons); font-style: normal; font-weight: normal; line-height: 1; }
kbd { font: 11px/1 var(--font); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--stroke); color: var(--text2); background: var(--hover); white-space: nowrap; }

.page { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head h1 { margin: 0; font: 600 22px/1.25 var(--display); text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--text2); max-width: 74ch; font-size: 13.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl > span { font-size: 12px; color: var(--text2); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--hover); border: 1px solid var(--stroke); border-radius: 7px; padding: 2px; gap: 2px; }
.seg button { padding: 3px 10px; border-radius: 5px; font-size: 12.5px; color: var(--text2); }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.play { height: 30px; padding: 0 14px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.play:hover { filter: brightness(1.08); }
.tryline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text2); }
.tryline b { color: var(--text); font-weight: 600; }
.stage { position: relative; width: 100%; }

/* ---------- Pulse window ---------- */
.win { position: absolute; top: 0; left: 0; width: 1180px; height: 700px; transform-origin: 0 0; display: flex; flex-direction: column; background: var(--title);
  border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; box-shadow: var(--win-shadow); font-size: 13px; line-height: 1.35; user-select: none; }
.titlebar { height: 48px; flex-shrink: 0; display: flex; align-items: center; }
.brand { width: 224px; display: flex; align-items: center; gap: 8px; padding-left: 12px; flex-shrink: 0; }
.brand b { font: 600 14px var(--display); }
.brand .tb-ic { margin-left: auto; margin-right: 4px; }
.tb-ic { width: 34px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); font-size: 15px; }
.tb-ic:hover { background: var(--hover); color: var(--text); }
.tabs { display: flex; align-items: flex-end; align-self: stretch; gap: 2px; }
.tab { height: 38px; width: 180px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-radius: 8px 8px 0 0; color: var(--text2); position: relative; }
.tab.on { background: var(--sheet); color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: 12px; bottom: 2px; width: 18px; height: 3px; border-radius: 2px; background: var(--accent); }
.tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .ic { font-size: 9px; color: var(--text3); }
.caption { margin-left: auto; display: flex; align-items: center; height: 100%; }
.caption .cap { width: 46px; height: 100%; display: grid; place-items: center; font-size: 10px; }
.body { flex: 1; min-height: 0; display: flex; background: var(--sheet); }
.sidebar { width: 224px; flex-shrink: 0; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.sb-h { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; color: var(--text2); font-weight: 600; font-size: 12.5px; margin-top: 4px; }
.sb-i { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; white-space: nowrap; }
.sb-i:hover { background: var(--hover); }
.sb-i .ic { font-size: 14px; color: var(--accent-fg); width: 16px; text-align: center; }
.sb-i small { margin-left: auto; color: var(--text3); font-size: 11.5px; }
.sb-i.drop { box-shadow: inset 0 0 0 1.5px var(--accent-fg); }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nav { height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; }
.navb { width: 30px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); font-size: 15px; }
.navb:hover { background: var(--hover); }
.addr { flex: 1; height: 32px; border-radius: 6px; background: var(--input); border: 1px solid var(--stroke); display: flex; align-items: center; gap: 4px; padding: 0 10px; margin: 0 6px; white-space: nowrap; overflow: hidden; }
.addr .cs { font-family: var(--icons); font-size: 9px; color: var(--text3); }
.addr span:last-child { font-weight: 600; }
.search { width: 280px; height: 32px; border-radius: 6px; background: var(--input); border: 1px solid var(--stroke); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--text3); }
.toolbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 8px 4px; }
.newbtn { height: 30px; display: flex; align-items: center; border-radius: 6px; background: var(--accent); color: var(--on-accent); margin-right: 6px; }
.newbtn > span { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 100%; }
.newbtn > span + span { border-left: 1px solid rgba(255,255,255,.28); padding: 0 8px; font-size: 10px; }
.tbtn { height: 30px; min-width: 32px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tbtn .ic { font-size: 15px; color: var(--text2); }
.tbtn:hover { background: var(--hover); }
.tsep { width: 1px; height: 18px; background: var(--divider); margin: 0 6px; }
.grow { flex: 1; }
.panes { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 8px 4px 4px; }
.pane { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--stroke); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.ph { height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 14px; position: relative; }
.ph .pbar { position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); opacity: 0; }
.pane.focused .pbar { opacity: 1; }
.ph .pt { font-weight: 600; font-size: 13.5px; color: var(--text2); }
.pane.focused .pt { color: var(--text); }
.ph .pp { color: var(--text3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.badge { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-fg); flex-shrink: 0; white-space: nowrap; }
.ph .sp { flex: 1; }
.ib { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--text2); }
.ib .ic { font-size: 14px; }
.ch { height: 30px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0,1fr) 128px 84px; align-items: center; padding: 0 12px 0 14px; color: var(--text2); font-size: 12.5px; border-bottom: 1px solid var(--divider); }
.ch span:first-child { color: var(--accent-fg); font-weight: 600; }
.ch .r, .row .r { text-align: right; }
.rows { flex: 1; min-height: 0; overflow: hidden; padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.row { height: 28px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0,1fr) 128px 84px; align-items: center; padding: 0 6px 0 8px; border-radius: 5px; font-variant-numeric: tabular-nums; transition: opacity .3s, transform .3s; }
.row:hover { background: var(--hover); }
.row.sel { background: linear-gradient(90deg, var(--sel-a), var(--sel-b)); box-shadow: inset 0 0 0 1px var(--sel-line); }
.pane:not(.focused) .row.sel { background: var(--hover); box-shadow: none; }
.row.flash { animation: flash 1.6s ease 2; }
@keyframes flash { 0%, 100% { background: var(--sel-b); } 35% { background: var(--accent-soft2); box-shadow: inset 0 0 0 1.5px var(--accent-fg); } }
.row.gone { opacity: 0; transform: translateX(-24px); height: 0; margin-top: -2px; overflow: hidden; }
.row.ghost { opacity: .45; }
.row .n { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d, .row .s { color: var(--text2); font-size: 12.5px; white-space: nowrap; }
.fi { width: 16px; height: 16px; flex-shrink: 0; }
.pane.arrive { animation: arrive .45s cubic-bezier(.2,.8,.2,1); }
@keyframes arrive { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.locate-tag { position: absolute; right: 10px; top: 44px; z-index: 3; padding: 4px 10px; border-radius: 12px; background: var(--flyout); box-shadow: var(--shadow); font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 8px; animation: arrive .3s ease; }
.locate-tag b { color: var(--text); font-weight: 600; }
.locate-tag button { color: var(--accent-fg); }

/* ---------- status bar & pill ---------- */
.status { height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--status); color: var(--text2); font-size: 12px; white-space: nowrap; position: relative; }
.status .fill { flex: 1; }
.ai { display: flex; align-items: center; gap: 6px; margin-left: -4px; padding: 0 8px 0 6px; height: 22px; border-radius: 11px; }
.ai .spark { color: var(--accent-fg); font-size: 11px; }
.ai b { color: var(--text); font-size: 11.5px; }
.pill { height: 22px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 9px; border-radius: 11px; background: var(--hover); color: var(--text); position: relative; overflow: hidden; transition: background .2s; }
.pill:hover { background: var(--pressed); box-shadow: inset 0 0 0 1px var(--stroke); }
.pill .pbody { display: flex; align-items: center; gap: 7px; height: 100%; padding-right: 6px; }
.pill .pct { color: var(--accent-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.pill .ring { width: 14px; height: 14px; border-radius: 50%; -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.5px); mask: radial-gradient(circle, transparent 4px, #000 4.5px); flex-shrink: 0; }
.pill .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent-fg); }
.pill.done { background: var(--ok-soft); }
.pill.done .okic { color: var(--ok); font-size: 11px; }
.pill.paused { background: var(--warn-soft); }
.pill.paused .pct { color: var(--warn); }
.pill.need { background: var(--warn-soft); }
.pill.need .ic { color: var(--warn); font-size: 11px; }
.pill.fail { background: var(--danger-soft); }
.pill.fail .ic { color: var(--danger); font-size: 11px; }
.pill .act { height: 18px; padding: 0 8px; border-radius: 9px; color: var(--accent-fg); display: flex; align-items: center; gap: 4px; font-weight: 600; }
.pill .act:hover { background: var(--card); }
.pill .act .ic { font-size: 10px; color: inherit; }
.pill .count { min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 10.5px; display: grid; place-items: center; padding: 0 4px; font-weight: 600; }
.pill.compact { padding: 0 8px; }
.pill.compact .ptext, .pill.compact .act { display: none; }
.pill.enter { animation: pillIn .4s cubic-bezier(.2,.8,.2,1); }
@keyframes pillIn { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.pill .tick { position: absolute; right: 0; bottom: 0; height: 2px; background: var(--ok); opacity: .6; }

/* ---------- dialogs (own windows over Pulse) ---------- */
.dlg { position: absolute; z-index: 20; width: 440px; background: var(--dlg); border: 1px solid var(--stroke); border-radius: 8px; box-shadow: var(--dlg-shadow); display: flex; flex-direction: column; overflow: hidden; }
.dlg[hidden] { display: none; }
.dlg.wide { width: 500px; }
.dlg.mid { width: 460px; }
.dtb { height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 12px; color: var(--text2); }
.dtb .sp { flex: 1; }
.dtb .cb { width: 46px; height: 36px; display: grid; place-items: center; font-size: 10px; color: var(--text); align-self: flex-start; }
.dtb .cb:hover { background: var(--hover); }
.dtb .cb.x:hover { background: #C42B1C; color: #fff; }
.dbody { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.dtitle { font: 600 16px/1.3 var(--display); display: flex; align-items: center; gap: 8px; }
.dtitle .ic { font-size: 16px; }
.dtitle .ic.ok { color: var(--ok); } .dtitle .ic.bad { color: var(--danger); } .dtitle .ic.warn { color: var(--warn); }
.route { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--text2); font-size: 12.5px; margin-top: -2px; }
.rchip { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 6px; border-radius: 5px; color: var(--text); max-width: 180px; }
.rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rchip:hover { background: var(--hover); color: var(--accent-fg); }
.rchip .ic { font-size: 9px; color: var(--text3); opacity: 0; }
.rchip:hover .ic { opacity: 1; color: var(--accent-fg); }
.route .arr { font-family: var(--icons); font-size: 10px; color: var(--text3); }
.queue { margin-left: auto; font-size: 12px; color: var(--accent-fg); display: flex; align-items: center; gap: 4px; }
.queue:hover { text-decoration: underline; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 2px; }
.pctbig { font: 300 40px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pctbig small { font-size: 18px; color: var(--text2); margin-left: 2px; }
.hspd { text-align: right; display: flex; flex-direction: column; gap: 2px; padding-bottom: 3px; }
.hspd b { font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
.hspd span { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
.graph { width: 100%; height: 64px; display: block; border-radius: 4px; }
.ditem { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dsub { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; margin-top: -4px; }
.details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; padding: 10px 12px; border-radius: 6px; background: var(--hover); font-size: 12.5px; }
.details div { display: flex; justify-content: space-between; gap: 8px; }
.details span { color: var(--text2); }
.details b { font-weight: 600; font-variant-numeric: tabular-nums; }
.dqueue { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--divider); padding-top: 8px; }
.dqueue .qh { font-size: 12px; color: var(--text2); display: flex; justify-content: space-between; }
.qrow { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; border-radius: 5px; font-size: 12.5px; }
.qrow:hover { background: var(--hover); }
.qrow .ic { font-size: 12px; color: var(--text2); width: 16px; text-align: center; }
.qrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow small { color: var(--text3); }
.qrow .qx { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-size: 9px; color: var(--text2); }
.qrow .qx:hover { background: var(--pressed); }
.dfoot { min-height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid var(--divider); background: var(--sheet); position: relative; }
.dfoot .sp { flex: 1; }
.btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--stroke); background: var(--card); color: var(--text); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; }
.btn:hover { background: var(--flyout); border-color: var(--text3); }
.btn .ic { font-size: 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger-fill); border-color: var(--danger-fill); color: #fff; }

/* ---------- numbers ---------- */
function nums() {
  const s = sc(), p = S.p;
  const doneItems = Math.round(s.total * p), left = s.total - doneItems;
  const leftBytes = (s.bytes * (1 - p)).toFixed(s.unit === 'GB' ? 2 : 1);
  const cur = S.samples.length ? S.samples[S.samples.length - 1] : .7;
  const speed = s.speed ? (s.speed * (cur / .75)).toFixed(1) + ' MB/s' : Math.round(380 * cur / .6) + ' 项/秒';
  const eta = Math.max(1, Math.round((1 - p) * 36));
  return { doneItems, left, leftBytes, speed, eta };
}

/* ---------- dialog ---------- */
function graphSVG() {
  const W = 408, H = 64, n = 120;
  const pts = S.samples.map((v, i) => [i / (n - 1) * W, H - 4 - v * (H - 12)]);
  const paused = S.phase === 'paused';
  const col = paused || S.phase === 'partial' ? 'var(--text3)' : 'var(--accent-fg)';
  let area = '', line = '', dot = '';
  if (pts.length > 1) {
    line = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
    area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H} L0 ${H} Z`;
    const e = pts[pts.length - 1];
    dot = `<circle cx="${e[0]}" cy="${e[1]}" r="3.2" fill="${S.phase === 'done' ? 'var(--ok)' : col}"/>`;
  }
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <rect x="0" y="0" width="${W}" height="${H}" rx="4" fill="var(--graph-track)"/>
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity=".04"/></linearGradient></defs>
    ${area ? `<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>${dot}` : ''}
  </svg>`;
}

/* ---------- flows ---------- */
let runT = 0;

function renderLive() {

/* ---------- events ---------- */

    case 'qcancel': S.queue = Math.max(0, S.queue - 1); toast('已取消排队中的任务'); render(); if (!$('#hist').hidden) toggleHist(true); break;
    case 'clearhist': S.history = []; toggleHist(true); break;
    case 'flocate': toast('在新标签页打开所在文件夹，并选中这一项'); break;
    case 'fretry': { const row = t.closest('.frow'); row.classList.add('ok'); row.querySelector('.why').textContent = '已完成'; row.querySelector('.fa').innerHTML = ''; break; }
    case 'retryall': $$('#dlg .frow').forEach(r => { r.classList.add('ok'); r.querySelector('.why').textContent = '已完成'; r.querySelector('.fa').innerHTML = ''; }); setTimeout(() => { applyResult(); S.phase = 'done'; S.closed = false; render(); finish(); }, 600); break;
    case 'copyerr': toast('已复制 2 条失败信息（路径 + 原因）'); break;
    case 'diff': toast('打开「文本对比」：两个 release-notes.md 并排比较'); break;
    case 'preview': toast('空格预览复制过来的版本'); break;
    case 'resolve': if (S.applyRest) { S.phase = 'running'; S.dlg = true; S.p = .42; seedSamples(.42); render(); startRun(.42); } else { S.conflictIdx = Math.min(4, S.conflictIdx + 1); renderDialog(); } break;
    case 'applyrest': S.applyRest = !S.applyRest; renderDialog(); break;
    case 'tobin': S.sc = 'del'; resetScenario(); startRun(0); break;
    case 'permgo': resetScenario(); startRun(0); break;
    case 'noop': toast('沿用现有行为'); break;
  }
});
document.addEventListener('mouseover', e => {
  const el = e.target.closest('#win [data-tip]');
  if (el && !el.contains(e.relatedTarget)) { clearTimeout(tipT); tipT = setTimeout(() => showTip(el), $('#tip').classList.contains('on') ? 0 : 380); }
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest('#win [data-tip]');
  if (el && !el.contains(e.relatedTarget)) { clearTimeout(tipT); $('#tip').classList.remove('on'); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#menu').hidden) { $('#menu').hidden = true; return; }
  if (!$('#hist').hidden) { $('#hist').hidden = true; return; }
  if (!$('#dlg').hidden && ['running', 'paused', 'done'].includes(S.phase)) hideDialog();
});

function fitStage() {
  const stage = $('#stage'), win = $('#win');
  const kk = Math.min(1, stage.clientWidth / 1182);
  S._scale = kk;
  win.style.transform = `scale(${kk})`;
  win.style.left = Math.max(0, (stage.clientWidth - 1182 * kk) / 2) + 'px';
  stage.style.height = 702 * kk + 'px';
}
window.addEventListener('resize', fitStage);

const ph0 = qs.get('phase');
if (ph0 && PHASES[S.sc].some(p => p[0] === ph0)) S.phase = ph0; else S.phase = PHASES[S.sc][0][0];
if (S.phase === 'done' || S.phase === 'partial') { S.p = 1; seedSamples(1); }
if (S.phase === 'done') applyResult();
if (S.phase === 'hidden') S.dlg = false;

if (qs.has('hist')) { toggleHist(true); }

if (S.phase === 'done' && !S._static && !qs.has('closed') && !qs.has('locate')) finish();
